# talos-gpu-01 carries accelerator=amd-strix-halo:NoSchedule so GPU workloads
# land there exclusively. Longhorn must tolerate that taint: the node is a
# storage node (iscsi-tools label + /var/mnt/longhorn disk) and without the
# toleration, manager/CSI/engine-image DaemonSets report desired=2 while
# leftover pods on the GPU node trip KubeDaemonSetMisScheduled /
# KubeDaemonSetRolloutStuck.
#
# Stability note: co-locating Longhorn instance-managers with ROCm on Strix Halo
# increases IO+memory pressure and correlates with node wedges (ping OK, apid
# dead). Prefer cordoning Longhorn *scheduling* on talos-gpu-01 in the Longhorn
# UI (Node → Allow Scheduling = false) once replicas are healthy on the Proxmox
# workers — keep DaemonSet tolerations so existing engine pods can drain cleanly.
# Do not remove the toleration until that node has no Longhorn volumes.

gpuAcceleratorToleration: &gpuAcceleratorToleration
  - key: accelerator
    operator: Equal
    value: amd-strix-halo
    effect: NoSchedule

defaultSettings:
  defaultDataPath: /var/mnt/longhorn
  defaultReplicaCount: 2
  nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
  systemManagedComponentsNodeSelector: extensions.talos.dev/iscsi-tools:v0.2.0
  # Format: key=value:effect (semicolon-separated for multiple). Applies to
  # instance-manager, engine-image, share-manager, etc. managed by Longhorn.
  taintToleration: accelerator=amd-strix-halo:NoSchedule
ingress:
  enabled: true
  host: longhorn.k8s.home
  ingressClassName: nginx
  tls: false
longhornDriver:
  nodeSelector:
    extensions.talos.dev/iscsi-tools: v0.2.0
  tolerations: *gpuAcceleratorToleration
longhornManager:
  nodeSelector:
    extensions.talos.dev/iscsi-tools: v0.2.0
  tolerations: *gpuAcceleratorToleration
longhornUI:
  replicas: 1
persistence:
  defaultClass: false
  defaultClassReplicaCount: 2
  defaultFsType: ext4
  reclaimPolicy: Retain

