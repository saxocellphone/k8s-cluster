hostname: rancher.victornazzaro.com
replicas: 1
bootstrapPassword: admin

# Rancher asks cert-manager to mint a self-signed cert. Public access should
# be protected by Cloudflare Access in front of the Cloudflare Tunnel route.
ingress:
  ingressClassName: nginx
  tls:
    source: rancher

tls: ingress
certmanager:
  version: v1.20.2

# Rancher regularly climbs past 1.5–1.7Gi and was OOMKilled under a 2Gi limit
# (3 restarts / 14d; last OOM 2026-06-29). Give it headroom for informer caches
# and UI subscribe websockets on this ~5-node local cluster.
resources:
  requests:
    # Idle is ~25m; 500m was packing PVE workers for no benefit.
    cpu: 100m
    memory: 1536Mi
  limits:
    memory: 4Gi
