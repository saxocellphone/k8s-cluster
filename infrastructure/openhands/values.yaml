env:
  DISABLE_WAITLIST: "true"
  LITELLM_DEFAULT_MODEL: litellm_proxy/local-qwen3-27b
  # Browser talks to sandboxes directly; must be public HTTPS (CF tunnel),
  # not LAN-only *.runtime.openhands.k8s.home — otherwise the UI shows
  # "network error" even when the agent pod is Ready in-cluster.
  # Hosts must be a single label under the zone apex so CF Universal SSL
  # (*.victornazzaro.com) covers TLS. Nested names (*.oh-rt.…, *.runtime.…)
  # fail handshake on free CF.
  RUNTIME_URL_PATTERN: "https://{runtime_id}.victornazzaro.com"
  WEB_HOST: openhands.victornazzaro.com
  AUTH_WEB_HOST: openhands-auth.victornazzaro.com
  AUTH_URL: https://openhands-auth.victornazzaro.com
  OH_APP_CONVERSATION__SANDBOX_STARTUP_TIMEOUT: "300"
  OH_SANDBOX__START_SANDBOX_TIMEOUT: "300"
  OH_PERMITTED_CORS_ORIGINS: '["https://openhands.victornazzaro.com"]'
  REDIS_HOST: redis.redis.svc.cluster.local
  REDIS_PORT: "6379"
  FILE_STORE: s3
  AWS_S3_ENDPOINT: http://minio.minio.svc.cluster.local:9000
  AWS_S3_BUCKET: openhands-sessions
  AWS_S3_SECURE: "false"

ingress:
  enabled: true
  host: openhands.k8s.home
  class: nginx
  root:
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

tls:
  enabled: false

filestore:
  ephemeral: false
  bucket: openhands-sessions
  type: s3

minio:
  enabled: false

github:
  enabled: true

keycloak:
  enabled: true
  url: http://keycloak
  ingress:
    enabled: true
    hostname: auth.openhands.k8s.home
    ingressClassName: nginx
    tls: false
  nodeSelector:
    extensions.talos.dev/iscsi-tools: v0.2.0
  externalDatabase:
    host: platform-postgres-rw.database.svc.cluster.local
    port: 5432
    database: openhands_keycloak
    existingSecret: postgres-password
    existingSecretUserKey: username
    existingSecretPasswordKey: password
    sslMode: prefer

postgresql:
  enabled: false
  auth:
    username: openhands
    database: openhands
    existingSecret: postgres-password

externalDatabase:
  enabled: true
  host: platform-postgres-rw.database.svc.cluster.local
  port: "5432"
  username: openhands
  database: openhands
  sslMode: prefer
  existingSecret: postgres-password

redis:
  enabled: false

litellm-helm:
  enabled: true
  nodeSelector:
    extensions.talos.dev/iscsi-tools: v0.2.0
  db:
    deployStandalone: false
    useExisting: true
    database: openhands_litellm
    endpoint: platform-postgres-rw.database.svc.cluster.local
    secret:
      name: postgres-password
      usernameKey: username
      passwordKey: password
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: llm-proxy.openhands.k8s.home
        paths:
          - path: /
            pathType: Prefix
    tls: []
  proxy_config:
    environment_variables:
      OR_APP_NAME: OpenHands
      OR_SITE_URL: http://openhands.k8s.home
    model_list:
      # Points at HIPFire (mode-switcher GPU mode). When llm/SGLang is active instead,
      # flip api_base back to http://llm.ai-inference.svc.cluster.local:8080/v1 and
      # model to openai/Qwen/Qwen3.6-27B — or run both backends via mode-switcher.
      - model_name: local-qwen3-27b
        litellm_params:
          model: openai/qwen3.6:27b
          api_base: http://hipfire.ai-inference.svc.cluster.local:11435/v1
          api_key: os.environ/OPENAI_API_KEY
      - model_name: local-qwen3-27b-sglang
        litellm_params:
          model: openai/Qwen/Qwen3.6-27B
          api_base: http://llm.ai-inference.svc.cluster.local:8080/v1
          api_key: os.environ/OPENAI_API_KEY
    general_settings:
      forward_client_headers_to_llm_api: false
    litellm_settings:
      num_retries: 3
      request_timeout: 600
      context_window_fallbacks: []
      allowed_fails: 3

sandbox:
  apiHostname: http://openhands-runtime-api:5000

runtime-api:
  enabled: true
  runtimeInSameCluster: true
  replicaCount: 1
  imagePullSecrets: []
  ingress:
    enabled: true
    host: runtime-api.openhands.k8s.home
    className: nginx
    tls: false
    annotations: {}
  env:
    DB_HOST: platform-postgres-rw.database.svc.cluster.local
    DB_PORT: "5432"
    DB_SSL_MODE: prefer
    PGSSLMODE: prefer
    DB_USER: openhands
    DB_NAME: openhands_runtime_api
    K8S_NAMESPACE: openhands
    # Public base so runtime Ingress hosts are {id}.victornazzaro.com (one label
    # under apex → CF Universal SSL). Tunnel catch-all *.victornazzaro.com →
    # ingress-nginx after named routes (terraform/cloudflare). Origin HTTP.
    RUNTIME_BASE_URL: victornazzaro.com
    RUNTIME_DISABLE_SSL: "false"
    # Default in the image is "traefik"; without this, resumed runtimes get an
    # IngressClass that nothing in the cluster implements, so
    # {id}.victornazzaro.com 404s and the app times out waiting for the sandbox
    # (even though the pod is Ready). Pause also deletes Service + Ingress, so
    # resume must recreate them with the right class every time.
    INGRESS_CLASS: nginx
    STORAGE_CLASS: longhorn-openhands-runtime
    RUNTIME_CLASS: ""
    # Sandboxes only schedule on Longhorn nodes (WaitForFirstConsumer SC +
    # topology). Those workers are small; 3Gi+10Gi ephemeral * N stuck runtimes
    # exhausts CPU/memory/ephemeral and new pods sit Pending until the app's
    # startup timeout. Keep requests modest so one sandbox fits per worker.
    # MEMORY_* must be Mi-suffixed integers — runtime-api parses with
    # int(MEMORY_LIMIT.rstrip("Mi")) and rejects Gi (breaks migrate-db init).
    MEMORY_REQUEST: 1536Mi
    MEMORY_LIMIT: 2048Mi
    CPU_REQUEST: 200m
    EPHEMERAL_STORAGE_SIZE: 2Gi
    # Match app-side OH_* timeouts so agent-server startup probes / longhorn
    # attach on cold nodes don't lose the race at the default 120s.
    STARTUP_GRACE_PERIOD: "300"
  databaseMigrations:
    waitForDatabase: true
    createDatabases: false
    migrate: true
  warmRuntimes:
    enabled: false
  autoscaling:
    enabled: false
  nodeSelector:
    extensions.talos.dev/iscsi-tools: v0.2.0
