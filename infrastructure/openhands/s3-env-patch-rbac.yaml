apiVersion: v1
kind: ServiceAccount
metadata:
  name: openhands-s3-env-patcher
  namespace: openhands
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openhands-s3-env-patcher
  namespace: openhands
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["openhands"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["litellm-env-secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openhands-s3-env-patcher
  namespace: openhands
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
subjects:
  - kind: ServiceAccount
    name: openhands-s3-env-patcher
    namespace: openhands
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openhands-s3-env-patcher
