apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# values.yaml is intentionally NOT listed here -- it's a Helm values file
# referenced by the `openhands` Application as $values, not a Kubernetes
# resource to apply.

resources:
  - s3-env-patch-rbac.yaml
  - s3-env-patch-job.yaml

generators:
  - secret-generator.yaml
