apiVersion: batch/v1
kind: Job
metadata:
  name: openhands-s3-env-patch
  namespace: openhands
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: openhands-s3-env-patcher
      automountServiceAccountToken: true
      containers:
        - name: kubectl
          image: alpine:3.22
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ceu
            - |
              apk add --no-cache curl ca-certificates
              curl -fsSL -o /tmp/kubectl https://dl.k8s.io/release/v1.34.2/bin/linux/amd64/kubectl
              chmod 0755 /tmp/kubectl
              /tmp/kubectl -n openhands set env deployment/openhands \
                --from=secret/litellm-env-secrets \
                --keys=AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      securityContext:
        seccompProfile:
          type: RuntimeDefault
