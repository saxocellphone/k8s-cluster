# Stakater Reloader rolling-restarts annotated workloads when their
# referenced ConfigMaps or Secrets change. Workloads opt in via pod-template
# annotation reloader.stakater.com/auto: "true" (preferred — reloads on any
# referenced CM/Secret) or per-resource configmap/secret.reloader.stakater.com/reload.

reloader:
  deployment:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi