# Stakater Reloader rolling-restarts annotated workloads when their
# referenced ConfigMaps or Secrets change. Opt in per workload via
# reloader.stakater.com/auto or configmap/secret.reloader.stakater.com/reload.

reloader:
  deployment:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi