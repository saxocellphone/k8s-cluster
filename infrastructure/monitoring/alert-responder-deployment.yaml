apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-responder
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alert-responder
  annotations:
    checkov.io/skip1: CKV_K8S_15=python:slim is pulled IfNotPresent after first install.
    checkov.io/skip2: CKV_K8S_22=pip install writes to /tmp at container start.
    checkov.io/skip3: CKV_K8S_35=Telegram credentials are required as env vars.
    checkov.io/skip4: CKV_K8S_38=Service account token is required for pod restart operations.
    checkov.io/skip5: CKV_K8S_40=python:slim runs as UID 1000.
    checkov.io/skip6: CKV_K8S_43=python base image is tag-pinned.
    checkov.io/skip7: CKV_K8S_11=CPU limit is intentionally omitted; responder is I/O-bound and capped by memory.
spec:
  # Single replica is intentional: alert handling is idempotent (Alertmanager
  # dedupes upstream) but parallel pod restart attempts could fight each
  # other. If we ever scale this it should become a leader-elected setup.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-responder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-responder
      annotations:
        # Reloader rolls the pod when alert-responder-code changes.
        configmap.reloader.stakater.com/reload: alert-responder-code
    spec:
      serviceAccountName: alert-responder
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: responder
          image: python:3.11-slim
          imagePullPolicy: Always
          # Install the kubernetes client lib at startup. Avoids needing a
          # custom image / private registry. Installed to a writable
          # PYTHONUSERBASE under /tmp because the default ~/.local is on
          # the read-only root path for non-root users.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              export PYTHONUSERBASE=/tmp/pypkgs
              mkdir -p "$PYTHONUSERBASE"
              pip install --user --quiet --no-cache-dir kubernetes==31.0.0
              exec python /app/responder.py
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HOME
              value: /tmp
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: alert-responder-telegram
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: alert-responder-telegram
                  key: TELEGRAM_CHAT_ID
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            # Generous initial delay because pip install runs at startup.
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
      volumes:
        - name: code
          configMap:
            name: alert-responder-code
            defaultMode: 0444
---
apiVersion: v1
kind: Service
metadata:
  name: alert-responder
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alert-responder
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alert-responder
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
