grafana:
  # Admin credentials come from the SOPS-encrypted Secret `grafana-admin`
  # in the monitoring namespace, applied by the monitoring-extras app.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  sidecar:
    datasources:
      initDatasources: true
      watchMethod: LIST

# Early-warning alerts for TSDB growth. The retentionSize cap (40 GiB) and
# the memory limit (2 GiB) protect Prometheus from outright failure, but they
# trigger only AT the limit. These alerts fire EARLIER so we can intervene
# before degradation: dropping recent metrics (size cap) or restart loops
# (memory limit) become inevitable.
additionalPrometheusRulesMap:
  prometheus-tsdb-guard:
    groups:
      - name: prometheus-tsdb-guard
        rules:
          # Linear projection of on-disk size 7 days into the future. If we'd
          # exceed 30 GiB by then (75% of the 40 GiB cap), retention.size
          # truncation is imminent and we'll start losing the older end of
          # the 15d query window. Use 6h sample window so transient bumps
          # don't fire it.
          - alert: PrometheusStorageProjectedFull
            expr: |
              predict_linear(prometheus_tsdb_storage_blocks_bytes[6h], 7 * 24 * 3600)
                > 30 * 1024 * 1024 * 1024
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "Prometheus TSDB on-disk size projected to exceed 30 GiB within 7 days"
              description: |
                Linear projection of prometheus_tsdb_storage_blocks_bytes over the
                last 6h indicates on-disk size will exceed 30 GiB within 7 days
                (current cap: 40 GiB via --storage.tsdb.retention.size). Once the
                cap is hit, the oldest blocks will be truncated regardless of the
                15d time-based retention. Investigate cardinality growth via
                /api/v1/status/tsdb (top series-by-metric) and the new-jobs query:
                count by (job)({__name__=~".+"}).

          # Absolute head series threshold. Current baseline is ~138k. 1M is
          # ~7x baseline -- well beyond what would be expected from organic
          # cluster growth, so almost certainly a cardinality bug somewhere.
          - alert: PrometheusHeadSeriesHigh
            expr: prometheus_tsdb_head_series > 1000000
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Prometheus head series exceeds 1M (currently {{ $value | humanize }})"
              description: |
                Active in-memory series count is over 1,000,000. Baseline for this
                cluster is ~138k. This is almost always a misbehaving exporter
                (unique label values per request, IDs in label values, etc).
                Memory use scales with cardinality and the container limit is 2 Gi.

          # Fires the first time retention.size actually deletes blocks. This
          # is the "your protection just kicked in" alarm: the cluster is now
          # storing less than 15 days of metrics, and it'll keep shrinking
          # until ingestion drops or the PVC is grown.
          - alert: PrometheusRetentionSizeTriggered
            expr: increase(prometheus_tsdb_size_retentions_total[1h]) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Prometheus is dropping blocks due to size cap, not age"
              description: |
                prometheus_tsdb_size_retentions_total has incremented in the last
                hour, meaning the 40 GiB --storage.tsdb.retention.size cap
                truncated blocks before the 15d time-based retention would have.
                Effective query window is now less than 15d. Either increase the
                PVC + retentionSize, or reduce ingestion via metricRelabelings.

# Drop a small set of apiserver histogram bucket families that contribute
# significant cardinality (~13% of total series) but are not referenced by
# any default kube-prometheus-stack alert rule or built-in dashboard. The
# corresponding _count and _sum metrics are kept, so average-over-time
# queries remain available.
#
# KNOWN ISSUE (kube-prometheus-stack 80.13.0 + Prometheus 3.9.0):
# Operator-generated metric_relabel_configs are silently ignored. The rule
# below ends up correctly written into the on-disk Prometheus config and
# passes `promtool check config`, but
#   sum(scrape_samples_scraped) - sum(scrape_samples_post_metric_relabeling)
# is exactly 0 across every job (including pre-existing kubelet drops that
# ship with the chart). This rule is left in place so it starts working once
# the upstream bug is fixed in a chart/Prometheus upgrade. Until then, the
# `retentionSize: 40GiB` cap below is what protects us from disk exhaustion.
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      - sourceLabels: [__name__]
        regex: 'apiserver_(request_body_size_bytes|response_sizes|watch_cache_read_wait_seconds|watch_list_duration_seconds)_bucket'
        action: drop

prometheus:
  prometheusSpec:
    retention: 15d
    # Hard storage cap: drop oldest blocks before disk fills. Set to ~80% of the
    # 50 Gi PVC so there's headroom for compaction (Prom rewrites blocks during
    # compaction, transiently using up to ~2x the largest block's space).
    # Without this, a cardinality explosion would fill the PV in days and put
    # the TSDB into an unrecoverable crashloop.
    retentionSize: "40GiB"
    # Resource budget. Currently ~715Mi / 80m at steady state.
    # Memory LIMIT (not just request) is what protects the node: a cardinality
    # explosion OOM-kills the container instead of evicting other pods on the
    # node. Intentionally no CPU limit — CPU throttling hurts query latency
    # more than it saves anything.
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 2Gi
    nodeSelector:
      extensions.talos.dev/iscsi-tools: v0.2.0
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 50Gi
          storageClassName: longhorn
