grafana:
  # Admin credentials come from the SOPS-encrypted Secret `grafana-admin`
  # in the monitoring namespace, applied by the monitoring-extras app.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  sidecar:
    datasources:
      initDatasources: true
      watchMethod: LIST

# Route all alerts to the alert-responder webhook in this namespace.
# The responder attempts safe per-alertname remediation, then crafts a
# Telegram message via OpenClaw (with direct-Telegram fallback when
# OpenClaw is unreachable).
alertmanager:
  config:
    route:
      receiver: alert-responder
      # Group by alertname so a burst of related fires becomes one webhook
      # delivery, but route every group to the responder. No child routes
      # for now -- one receiver handles everything.
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Watchdog is the always-firing canary that confirms the alerting
        # pipeline works. Don't bother the user with it -- send to /dev/null.
        - matchers:
            - alertname = "Watchdog"
          receiver: "null"
        # InfoInhibitor is intentionally always-active to suppress info-level
        # noise; same treatment.
        - matchers:
            - alertname = "InfoInhibitor"
          receiver: "null"
    receivers:
      - name: "null"
      - name: alert-responder
        webhook_configs:
          - url: http://alert-responder.monitoring.svc:8080/webhook
            send_resolved: true
            max_alerts: 0  # 0 means unlimited per request
    inhibit_rules:
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity =~ "warning|info"
        equal: ["alertname", "namespace"]

# Early-warning alerts for TSDB growth. The retentionSize cap (40 GiB) and
# the memory limit (2 GiB) protect Prometheus from outright failure, but they
# trigger only AT the limit. These alerts fire EARLIER so we can intervene
# before degradation: dropping recent metrics (size cap) or restart loops
# (memory limit) become inevitable.
additionalPrometheusRulesMap:
  prometheus-tsdb-guard:
    groups:
      - name: prometheus-tsdb-guard
        rules:
          # Linear projection of on-disk size 7 days into the future. If we'd
          # exceed 30 GiB by then (75% of the 40 GiB cap), retention.size
          # truncation is imminent and we'll start losing the older end of
          # the 15d query window. Use 6h sample window so transient bumps
          # don't fire it.
          - alert: PrometheusStorageProjectedFull
            expr: |
              predict_linear(prometheus_tsdb_storage_blocks_bytes[6h], 7 * 24 * 3600)
                > 30 * 1024 * 1024 * 1024
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "Prometheus TSDB on-disk size projected to exceed 30 GiB within 7 days"
              description: |
                Linear projection of prometheus_tsdb_storage_blocks_bytes over the
                last 6h indicates on-disk size will exceed 30 GiB within 7 days
                (current cap: 40 GiB via --storage.tsdb.retention.size). Once the
                cap is hit, the oldest blocks will be truncated regardless of the
                15d time-based retention. Investigate cardinality growth via
                /api/v1/status/tsdb (top series-by-metric) and the new-jobs query:
                count by (job)({__name__=~".+"}).

          # Absolute head series threshold. Current baseline is ~138k. 1M is
          # ~7x baseline -- well beyond what would be expected from organic
          # cluster growth, so almost certainly a cardinality bug somewhere.
          - alert: PrometheusHeadSeriesHigh
            expr: prometheus_tsdb_head_series > 1000000
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Prometheus head series exceeds 1M (currently {{ $value | humanize }})"
              description: |
                Active in-memory series count is over 1,000,000. Baseline for this
                cluster is ~138k. This is almost always a misbehaving exporter
                (unique label values per request, IDs in label values, etc).
                Memory use scales with cardinality and the container limit is 2 Gi.

          # Fires the first time retention.size actually deletes blocks. This
          # is the "your protection just kicked in" alarm: the cluster is now
          # storing less than 15 days of metrics, and it'll keep shrinking
          # until ingestion drops or the PVC is grown.
          - alert: PrometheusRetentionSizeTriggered
            expr: increase(prometheus_tsdb_size_retentions_total[1h]) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Prometheus is dropping blocks due to size cap, not age"
              description: |
                prometheus_tsdb_size_retentions_total has incremented in the last
                hour, meaning the 40 GiB --storage.tsdb.retention.size cap
                truncated blocks before the 15d time-based retention would have.
                Effective query window is now less than 15d. Either increase the
                PVC + retentionSize, or reduce ingestion via metricRelabelings.

  longhorn-health:
    groups:
      - name: longhorn-health
        rules:
          - alert: LonghornVolumeDegraded
            expr: longhorn_volume_robustness == 2
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Longhorn volume {{ $labels.volume }} is degraded"
              description: |
                Volume {{ $labels.volume }} on node {{ $labels.node }} has lost
                a replica and is running with reduced redundancy for 10m+.
                Check Longhorn UI (http://longhorn.k8s.home) for details.

          - alert: LonghornVolumeFaulted
            expr: longhorn_volume_robustness == 3
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Longhorn volume {{ $labels.volume }} is FAULTED (data unavailable)"
              description: |
                Volume {{ $labels.volume }} has all replicas failed. Workload
                using this volume cannot read or write. Investigate immediately
                via Longhorn UI.

          - alert: LonghornNodeStorageFull
            expr: |
              (longhorn_node_storage_usage_bytes
                / longhorn_node_storage_capacity_bytes) > 0.85
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Longhorn node {{ $labels.node }} storage > 85% full"
              description: |
                Longhorn-managed disk on {{ $labels.node }} is {{ $value | humanizePercentage }} full.
                New volume creation and replica scheduling will fail when this
                hits the over-provisioning ceiling.

          - alert: LonghornDiskSchedulingDisabled
            expr: longhorn_disk_status{condition="Schedulable", condition_reason!=""} == 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Longhorn disk on {{ $labels.node }} is not schedulable"
              description: |
                Disk {{ $labels.disk }} on node {{ $labels.node }} cannot
                accept new replicas. Reason: {{ $labels.condition_reason }}.

  homelab-services:
    groups:
      - name: homelab-services
        rules:
          # qBittorrent's gluetun VPN sidecar dying without taking qBit down
          # would mean torrenting traffic leaks the host IP. Treat as critical.
          - alert: QbittorrentVPNSidecarDown
            expr: |
              kube_pod_container_status_ready{namespace="torrenting",pod=~"qbittorrent-.*",container="gluetun"} == 0
            for: 2m
            labels:
              severity: critical
              namespace: torrenting
            annotations:
              summary: "qBittorrent VPN sidecar (gluetun) is not ready"
              description: |
                Pod {{ $labels.pod }} container gluetun is not ready for 2m+.
                If qBittorrent itself is still running, traffic may leak the
                host IP. Either restart the pod or stop qBittorrent.

          # OpenClaw is the ops/notification path -- if it's down we lose
          # both Telegram remediation reports AND the bot interface.
          - alert: OpenclawDown
            expr: |
              kube_pod_status_ready{namespace="openclaw",condition="true"} * on(pod, namespace)
              kube_pod_labels{label_app="openclaw"} == 0
              or absent(kube_pod_status_ready{namespace="openclaw"})
            for: 5m
            labels:
              severity: critical
              namespace: openclaw
            annotations:
              summary: "OpenClaw gateway pod not ready"
              description: |
                The openclaw deployment has no ready pod for 5m+. Telegram-
                routed alerts (including this one) cannot be delivered. Check
                with kubectl logs -n openclaw deploy/openclaw.

          # Generic catch-all for any homelab workload pod stuck not-ready.
          # Excludes platform namespaces (kube-prometheus-stack already covers
          # those with KubeDeploymentReplicasMismatch / KubeStatefulSetReplicasMismatch).
          #
          # Two important `unless` clauses:
          #
          #   1. Job-owned pods (CronJob runs) become Ready=False the moment
          #      they complete and stay that way until the CronJob's history
          #      retention prunes them. Without this exclusion the alert fires
          #      every successful CronJob run after the 15m for-duration --
          #      and worse, the responder then "remediates" by deleting the
          #      completion-history pod, which is harmless but noisy.
          #
          #   2. Pods in terminal phases (Succeeded/Failed) are also Ready=
          #      False permanently. We only want the alert for pods that are
          #      meant to be Ready (Pending/Running/Unknown).
          - alert: HomelabPodStuckNotReady
            expr: |
              (
                kube_pod_status_ready{
                  namespace=~"torrenting|openclaw",
                  condition="true"
                } == 0
              )
              unless on (namespace, pod) (
                kube_pod_owner{owner_kind="Job"}
              )
              unless on (namespace, pod) (
                kube_pod_status_phase{phase=~"Succeeded|Failed"} == 1
              )
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} not ready for 15m"
              description: |
                Pod has not reached Ready state for 15m. Likely candidates:
                image pull failure, init container error, missing secret, or
                an ongoing rollout that's stuck. CronJob-completion pods are
                excluded by the alert expression; if you see this fire, it's
                a real workload pod that hasn't recovered.

          # Container OOM-killed in any homelab namespace. The default chart
          # rule fires only on "OOMKilled" containers in restartCount delta;
          # this catches the moment of the kill so we can act.
          - alert: HomelabContainerOOMKilled
            expr: |
              kube_pod_container_status_last_terminated_reason{
                namespace=~"torrenting|openclaw|monitoring",
                reason="OOMKilled"
              } * on(namespace, pod, container)
              kube_pod_container_status_last_terminated_exitcode != 0 == 1
              and on(namespace, pod, container)
              changes(kube_pod_container_status_restarts_total[5m]) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} OOMKilled"
              description: |
                Container was OOMKilled in the last 5 minutes. Either bump
                the memory limit, or investigate why memory grew (cardinality
                explosion for prom, leak elsewhere).

          # Postgres pod (torrenting/postgres-0) is the backbone of all *arr
          # apps' persistent state. Treat downtime as critical.
          - alert: TorrentingPostgresDown
            expr: |
              kube_statefulset_status_replicas_ready{namespace="torrenting",statefulset="postgres"} < 1
            for: 5m
            labels:
              severity: critical
              namespace: torrenting
            annotations:
              summary: "torrenting/postgres-0 has no ready replica"
              description: |
                The Postgres StatefulSet backing the *arr apps has 0 ready
                replicas for 5m+. All *arr apps will be erroring on database
                connections. Check pod events and PV state.

# Disable scrape targets for control-plane components that Talos does not
# expose on the conventional kube-prometheus-stack endpoints. Each ships with
# a Service + ServiceMonitor pointing at a host:port (10257/10259/10249) that
# Talos either binds to localhost only or doesn't expose at all -- the
# resulting `TargetDown` warnings have been firing forever with no actual
# fix path. Disabling here also drops the default PrometheusRules that
# reference these targets (notably KubeVersionMismatch's per-component
# version gather).
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

# Drop a small set of apiserver histogram bucket families that contribute
# significant cardinality (~13% of total series) but are not referenced by
# any default kube-prometheus-stack alert rule or built-in dashboard. The
# corresponding _count and _sum metrics are kept, so average-over-time
# queries remain available.
#
# KNOWN ISSUE (kube-prometheus-stack 80.13.0 + Prometheus 3.9.0):
# Operator-generated metric_relabel_configs are silently ignored. The rule
# below ends up correctly written into the on-disk Prometheus config and
# passes `promtool check config`, but
#   sum(scrape_samples_scraped) - sum(scrape_samples_post_metric_relabeling)
# is exactly 0 across every job (including pre-existing kubelet drops that
# ship with the chart). This rule is left in place so it starts working once
# the upstream bug is fixed in a chart/Prometheus upgrade. Until then, the
# `retentionSize: 40GiB` cap below is what protects us from disk exhaustion.
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      - sourceLabels: [__name__]
        regex: 'apiserver_(request_body_size_bytes|response_sizes|watch_cache_read_wait_seconds|watch_list_duration_seconds)_bucket'
        action: drop

prometheus:
  prometheusSpec:
    retention: 15d
    # Hard storage cap: drop oldest blocks before disk fills. Set to ~80% of the
    # 50 Gi PVC so there's headroom for compaction (Prom rewrites blocks during
    # compaction, transiently using up to ~2x the largest block's space).
    # Without this, a cardinality explosion would fill the PV in days and put
    # the TSDB into an unrecoverable crashloop.
    retentionSize: "40GiB"
    # Resource budget. Currently ~715Mi / 80m at steady state.
    # Memory LIMIT (not just request) is what protects the node: a cardinality
    # explosion OOM-kills the container instead of evicting other pods on the
    # node. Intentionally no CPU limit — CPU throttling hurts query latency
    # more than it saves anything.
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 2Gi
    nodeSelector:
      extensions.talos.dev/iscsi-tools: v0.2.0
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 50Gi
          storageClassName: longhorn
