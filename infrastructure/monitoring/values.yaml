grafana:
  adminPassword: UvhEdKDdtkH29s7sfWLbx3ACH4DlmqMLpI9ksNfT
  sidecar:
    datasources:
      initDatasources: true
      watchMethod: LIST

# Drop a small set of apiserver histogram bucket families that contribute
# significant cardinality (~13% of total series in this cluster) but are not
# referenced by any default kube-prometheus-stack alert rule or built-in
# dashboard. The corresponding _count and _sum metrics are kept (not dropped),
# so average-over-time queries remain available.
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      - sourceLabels: [__name__]
        regex: 'apiserver_(request_body_size_bytes|response_sizes|watch_cache_read_wait_seconds|watch_list_duration_seconds)_bucket'
        action: drop

prometheus:
  prometheusSpec:
    retention: 15d
    # Hard storage cap: drop oldest blocks before disk fills. Set to ~80% of the
    # 50 Gi PVC so there's headroom for compaction (Prom rewrites blocks during
    # compaction, transiently using up to ~2x the largest block's space).
    # Without this, a cardinality explosion would fill the PV in days and put
    # the TSDB into an unrecoverable crashloop.
    retentionSize: "40GiB"
    # Resource budget. Currently ~715Mi / 80m at steady state.
    # Memory LIMIT (not just request) is what protects the node: a cardinality
    # explosion OOM-kills the container instead of evicting other pods on the
    # node. Intentionally no CPU limit — CPU throttling hurts query latency
    # more than it saves anything.
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 2Gi
    nodeSelector:
      extensions.talos.dev/iscsi-tools: v0.2.0
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 50Gi
          storageClassName: longhorn
