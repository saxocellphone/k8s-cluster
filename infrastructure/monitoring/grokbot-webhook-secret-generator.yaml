# KSOPS generator for Secret/grokbot-webhook.
# Not listed in kustomization.yaml until grokbot-webhook-secret.yaml exists
# and is SOPS-encrypted. See grokbot-webhook.example.yaml.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: grokbot-webhook-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./grokbot-webhook-secret.yaml
