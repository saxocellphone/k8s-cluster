# KSOPS generator for Secret/grokbot-webhook (key: token).
# The secret file is a SOPS stub. Victor must replace stringData.token
# with the real webhook bearer token before Ryan can authenticate.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: grokbot-webhook-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./grokbot-webhook-secret.yaml
