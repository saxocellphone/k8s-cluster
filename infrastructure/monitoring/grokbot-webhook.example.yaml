# TODO(victor): this is a pattern, not a live manifest. It is intentionally
# NOT named *secret*.yaml (so .sops.yaml / Semgrep do not treat the
# placeholder as a committed Secret) and it is NOT in kustomization.yaml.
#
# Do not apply this file. Do not commit a plaintext grokbot-webhook-secret.yaml.
#
# 1. Copy this manifest to infrastructure/monitoring/grokbot-webhook-secret.yaml
#    (that filename matches .sops.yaml path_regex .*secret.*\.yaml$).
# 2. Replace stringData.token with the Ryan / Grok Bot webhook bearer token.
#    Raw token only: no "Bearer " prefix, no trailing newline.
#    Webhook URL (already in infrastructure/monitoring/values.yaml):
#    https://api2.cursor.sh/automations/webhook/3375e892-009e-54ac-83f4-19aa319426eb
# 3. Encrypt in place (requires repo-root key.txt):
#      SOPS_AGE_KEY_FILE=./key.txt sops -e -i infrastructure/monitoring/grokbot-webhook-secret.yaml
# 4. Uncomment grokbot-webhook-secret-generator.yaml under generators: in
#    infrastructure/monitoring/kustomization.yaml.
#
# Alertmanager mounts the Secret via alertmanager.alertmanagerSpec.secrets
# and sends Authorization: Bearer <token> from key `token`
# (credentials_file: /etc/alertmanager/secrets/grokbot-webhook/token).
# Until the Secret exists, Alertmanager pods cannot mount that volume.
#
# Field to fill in: stringData.token
apiVersion: v1
kind: Secret
metadata:
  name: grokbot-webhook
  namespace: monitoring
type: Opaque
stringData:
  token: "REPLACE_WITH_RYAN_WEBHOOK_BEARER_TOKEN"
