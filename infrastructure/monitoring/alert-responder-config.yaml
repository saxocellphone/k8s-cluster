apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-responder-code
  namespace: monitoring
data:
  responder.py: |
    """
    alert-responder: receives Alertmanager v2 webhooks, attempts safe
    remediation per a static playbook, and notifies the user via Telegram.

    Remediation is intentionally narrow: only `restart_pod` for now, only
    on alerts in the static PLAYBOOKS dict. Everything else is notify-only.
    """
    import json
    import logging
    import os
    import sys
    from http.server import HTTPServer, BaseHTTPRequestHandler
    from urllib import request as urlreq, error as urlerr

    from kubernetes import client, config

    BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
    CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

    config.load_incluster_config()
    v1 = client.CoreV1Api()

    # alertname -> remediation_action. None == "notify only, do not auto-act".
    PLAYBOOKS = {
        # Default kube-prometheus-stack alerts
        "KubePodCrashLooping": "restart_pod",
        "KubePodNotReady": "restart_pod",
        # Custom homelab alerts
        "QbittorrentVPNSidecarDown": "restart_pod",
        "HomelabPodStuckNotReady": "restart_pod",
        # Notify-only (data-sensitive or self-healing already)
        "TorrentingPostgresDown": None,
        "LonghornVolumeDegraded": None,
        "LonghornVolumeFaulted": None,
        "LonghornNodeStorageFull": None,
        "HomelabContainerOOMKilled": None,
    }

    log = logging.getLogger("responder")


    def restart_pod(alert):
        labels = alert["labels"]
        pod = labels.get("pod")
        ns = labels.get("namespace")
        if not (pod and ns):
            return "skipped: alert has no pod/namespace label"
        try:
            v1.delete_namespaced_pod(pod, ns)
            return f"deleted pod {ns}/{pod} (controller will recreate)"
        except client.ApiException as e:
            return f"delete failed: {e.status} {e.reason}"
        except Exception as e:
            return f"delete failed: {type(e).__name__}: {e}"


    REMEDIATIONS = {"restart_pod": restart_pod}


    def attempt_remediation(alert):
        name = alert["labels"]["alertname"]
        action = PLAYBOOKS.get(name)
        if action is None:
            return "no auto-remediation defined for this alert"
        fn = REMEDIATIONS.get(action)
        if not fn:
            return f"unknown action {action!r}"
        return fn(alert)


    def send_telegram(text):
        url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"
        payload = json.dumps({
            "chat_id": CHAT_ID,
            "text": text,
            "parse_mode": "HTML",
            "disable_web_page_preview": True,
        }).encode()
        req = urlreq.Request(
            url, data=payload, headers={"Content-Type": "application/json"}
        )
        try:
            with urlreq.urlopen(req, timeout=10) as r:
                return r.status == 200
        except urlerr.URLError as e:
            log.error("telegram send failed: %s", e)
            return False


    def alert_to_html(alert, remediation, note=""):
        labels = alert["labels"]
        ann = alert.get("annotations", {})
        sev = labels.get("severity", "?").upper()
        body = (
            f"<b>[{sev}] {labels['alertname']}</b>\n"
            f"{ann.get('summary', '')}\n"
            f"{ann.get('description', '')[:400]}\n\n"
            f"<i>Remediation: {remediation}</i>"
        )
        if note:
            body += f"\n<i>{note}</i>"
        return body


    def handle_alert(alert):
        name = alert["labels"]["alertname"]
        status = alert.get("status", "firing")

        if status == "resolved":
            send_telegram(f"<b>RESOLVED:</b> {name}")
            return

        remediation = attempt_remediation(alert)
        log.info("alert=%s status=%s remediation=%r", name, status, remediation)

        sent = send_telegram(alert_to_html(alert, remediation))
        log.info("telegram %s", "succeeded" if sent else "FAILED")


    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            if self.path != "/webhook":
                self.send_response(404); self.end_headers(); return
            try:
                length = int(self.headers.get("Content-Length", 0))
                body = json.loads(self.rfile.read(length).decode())
                for alert in body.get("alerts", []):
                    try:
                        handle_alert(alert)
                    except Exception:
                        log.exception("handle_alert crashed for %r",
                                      alert.get("labels"))
                self.send_response(200); self.end_headers()
                self.wfile.write(b"ok")
            except Exception as e:
                log.exception("webhook handler crashed")
                self.send_response(500); self.end_headers()
                self.wfile.write(str(e).encode())

        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200); self.end_headers()
                self.wfile.write(b"ok")
            else:
                self.send_response(404); self.end_headers()

        def log_message(self, fmt, *args):  # silence default access logging
            return


    def main():
        logging.basicConfig(
            level=logging.INFO, stream=sys.stdout,
            format="%(asctime)s %(levelname)s %(name)s %(message)s",
        )
        log.info("alert-responder starting on :8080")
        HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()


    if __name__ == "__main__":
        main()
