redisOperator:
  imagePullPolicy: IfNotPresent
  watchNamespace: redis
  # Chart injects FEATURE_GATES=AvoidCommandLinePassword=false,... but the
  # v0.25.0 binary rejects that gate and crash-loops. CLI flag overrides it.
  extraArgs:
    - "--feature-gates=GenerateConfigInInitContainer=false"

featureGates:
  GenerateConfigInInitContainer: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    # Explicit null: the chart's default values set cpu: 500m, and Helm's
    # merge can't drop a default by omission — only by nulling it.
    cpu: null
    memory: 512Mi

nodeSelector:
  extensions.talos.dev/iscsi-tools: v0.2.0
