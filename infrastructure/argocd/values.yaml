global:
  domain: argocd.k8s.home

server:
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: argocd.k8s.home

configs:
  cm:
    kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"
    # Auth is disabled: anyone reaching argocd-server is treated as the
    # anonymous user, which is granted admin via policy.default below.
    # LAN-only exposure (argocd.k8s.home) is the security boundary --
    # don't expose this Ingress publicly without restoring auth.
    users.anonymous.enabled: "true"
  rbac:
    policy.default: role:admin
  params:
    server.insecure: true

repoServer:
  env:
    - name: XDG_CONFIG_HOME
      value: /.config
    - name: SOPS_AGE_KEY_FILE
      value: /.config/sops/age/key.txt

  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: sops-age
      secret:
        secretName: sops-age

  initContainers:
    - name: install-ksops
      image: alpine:3.21
      command: ["/bin/sh", "-c"]
      args:
        - wget -qO /tmp/ksops.tar.gz https://github.com/viaduct-ai/kustomize-sops/releases/download/v4.4.0/ksops_4.4.0_Linux_x86_64.tar.gz &&
          tar -xzf /tmp/ksops.tar.gz -C /custom-tools &&
          chmod +x /custom-tools/ksops &&
          wget -qO /tmp/kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz &&
          tar -xzf /tmp/kustomize.tar.gz -C /custom-tools &&
          chmod +x /custom-tools/kustomize
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools

  volumeMounts:
    - mountPath: /usr/local/bin/kustomize
      name: custom-tools
      subPath: kustomize
    - mountPath: /usr/local/bin/ksops
      name: custom-tools
      subPath: ksops
    - mountPath: /.config/sops/age
      name: sops-age
