apiVersion: v1
kind: PersistentVolume
metadata:
  name: torrents-unified-pv
spec:
  capacity:
    storage: 10Ti
  accessModes:
  - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
  - nfsvers=4.1
  nfs:
    path: /Public/torrents
    server: 192.168.8.246
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: torrents-unified-pvc
  namespace: torrenting
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 10Ti
  volumeName: torrents-unified-pv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbit-config-pvc
  namespace: torrenting
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
