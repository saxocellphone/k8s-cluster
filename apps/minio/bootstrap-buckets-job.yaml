# Idempotent bucket bootstrap for in-cluster consumers (Terraform state, app uploads).
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bootstrap-buckets
  namespace: minio
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: minio-bootstrap
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        extensions.talos.dev/iscsi-tools: v0.2.0
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-04-16T18-13-26Z
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ceu
            - |
              until mc alias set local http://minio.minio.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "waiting for minio API..."
                sleep 5
              done
              for bucket in terraform-state homelab; do
                mc mb --ignore-existing "local/${bucket}"
                echo "ensured bucket: ${bucket}"
              done
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-password
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: mc-config
              mountPath: /tmp/.mc
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
      volumes:
        - name: mc-config
          emptyDir: {}
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault