apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: teslamate-postgres
  namespace: teslamate
  labels:
    app: teslamate-postgres
spec:
  serviceName: teslamate-postgres
  replicas: 1
  selector:
    matchLabels:
      app: teslamate-postgres
  template:
    metadata:
      labels:
        app: teslamate-postgres
    spec:
      nodeSelector:
        extensions.talos.dev/iscsi-tools: v0.2.0
      containers:
        - name: postgres
          image: postgres:17-bookworm
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: teslamate
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: teslamate-credentials
                  key: DATABASE_PASS
            - name: POSTGRES_DB
              value: teslamate
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "teslamate"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "teslamate"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 10Gi
