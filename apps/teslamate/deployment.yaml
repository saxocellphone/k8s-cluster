apiVersion: apps/v1
kind: Deployment
metadata:
  name: teslamate
  namespace: teslamate
  labels:
    app: teslamate
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: teslamate
  template:
    metadata:
      labels:
        app: teslamate
    spec:
      nodeSelector:
        extensions.talos.dev/iscsi-tools: v0.2.0
      containers:
        - name: teslamate
          image: teslamate/teslamate:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: teslamate-credentials
                  key: ENCRYPTION_KEY
            - name: DATABASE_USER
              value: teslamate
            - name: DATABASE_PASS
              valueFrom:
                secretKeyRef:
                  name: teslamate-credentials
                  key: DATABASE_PASS
            - name: DATABASE_NAME
              value: teslamate
            - name: DATABASE_HOST
              value: teslamate-postgres
            - name: MQTT_HOST
              value: localhost
          ports:
            - name: http
              containerPort: 4000
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: import
              mountPath: /opt/app/import
        # Mosquitto MQTT broker as a sidecar — TeslaMate expects it for
        # publishing vehicle state. Minimal resource footprint.
        - name: mosquitto
          image: eclipse-mosquitto:2
          imagePullPolicy: IfNotPresent
          command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
          ports:
            - name: mqtt
              containerPort: 1883
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: mosquitto-conf
              mountPath: /mosquitto-no-auth.conf
              subPath: mosquitto.conf
              readOnly: true
      volumes:
        - name: import
          emptyDir: {}
        - name: mosquitto-conf
          configMap:
            name: teslamate-mosquitto-config
