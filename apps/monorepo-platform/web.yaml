# Runko web UI (stage 13, both halves). The image is built with
# VITE_RUNKO_URL=/ (same-origin: ingress.yaml routes /runko.v1.* to
# runkod, everything else here), so the UI is LIVE against runkod on
# every host this ingress fronts; the fixture demo stays at /demo.
# Mutating anything requires the deploy token, entered per-browser via
# the sidebar's Set-token button (localStorage) - the public bundle
# deliberately ships tokenless so the public host never grants anonymous
# writes, matching ingress.yaml's auth posture.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runko-web
  namespace: maas-dev
  labels:
    app: runko-web
    app.kubernetes.io/part-of: monorepo-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: runko-web
  template:
    metadata:
      labels:
        app: runko-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/saxocellphone/runko/web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: runko-web
  namespace: maas-dev
  labels:
    app: runko-web
    app.kubernetes.io/part-of: monorepo-platform
spec:
  type: ClusterIP
  selector:
    app: runko-web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
