# Two hosts (LAN + public via CF tunnel, the opencode/memos pattern),
# path-routed: API + Connect RPC + git smart-HTTP to runkod, everything
# else to the web UI. Single-origin on purpose - the web UI's Connect
# calls (live since stage 13's server half) never cross origins, so no
# CORS is involved on the deployed site. Two Ingress objects because
# the git/API paths need streaming annotations (unbuffered, unlimited
# body for `git push`) that must not apply to the static site.
#
# Public host: Cloudflare Access is NOT used (API/git clients break on
# Access HTML, same reasoning as opencode) - runkod's own deploy-token
# auth gates every API/git path; only the demo web UI is truly anonymous.
#
# Git remote for humans/agents:
#   git clone http://user:<RUNKO_TOKEN>@runko.k8s.home/monorepo.git
#   git clone https://user:<RUNKO_TOKEN>@runko.victornazzaro.com/monorepo.git
# CLI: runko change land --runkod-url http://runko.k8s.home --token <t>
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: runkod
  namespace: maas-dev
  labels:
    app.kubernetes.io/part-of: monorepo-platform
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: runko.k8s.home
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: runkod
                port:
                  number: 8080
          # Connect RPC surface for the web UI (runkod/rpc.go, stage 13
          # server half): one Prefix path per service - pathType Prefix
          # matches whole path elements, so /runko.v1.ChangeService
          # matches /runko.v1.ChangeService/GetChange exactly as needed.
          # (A single ImplementationSpecific "/runko.v1." dot-path looked
          # cleaner but this controller build did not route it - verified
          # empirically: RPCs fell through to the web catch-all.)
          # Bearer-token gated by runkod itself, same as /api.
          - path: /runko.v1.ChangeService
            pathType: Prefix
            backend:
              service:
                name: runkod
                port:
                  number: 8080
          - path: /runko.v1.ProjectService
            pathType: Prefix
            backend:
              service:
                name: runkod
                port:
                  number: 8080
          - path: /runko.v1.WorkspaceService
            pathType: Prefix
            backend:
              service:
                name: runkod
                port:
                  number: 8080
          - path: /runko.v1.SearchService
            pathType: Prefix
            backend:
              service:
                name: runkod
                port:
                  number: 8080
          - path: /runko.v1.RepoService
            pathType: Prefix
            backend:
              service:
                name: runkod
                port:
                  number: 8080
          - path: /monorepo.git
            pathType: Prefix
            backend:
              service:
                name: runkod
                port:
                  number: 8080
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: runkod
                port:
                  number: 8080
          - path: /readyz
            pathType: Exact
            backend:
              service:
                name: runkod
                port:
                  number: 8080
    - host: runko.victornazzaro.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: runkod
                port:
                  number: 8080
          - path: /runko.v1.ChangeService
            pathType: Prefix
            backend:
              service:
                name: runkod
                port:
                  number: 8080
          - path: /runko.v1.ProjectService
            pathType: Prefix
            backend:
              service:
                name: runkod
                port:
                  number: 8080
          - path: /runko.v1.WorkspaceService
            pathType: Prefix
            backend:
              service:
                name: runkod
                port:
                  number: 8080
          - path: /runko.v1.SearchService
            pathType: Prefix
            backend:
              service:
                name: runkod
                port:
                  number: 8080
          - path: /runko.v1.RepoService
            pathType: Prefix
            backend:
              service:
                name: runkod
                port:
                  number: 8080
          - path: /monorepo.git
            pathType: Prefix
            backend:
              service:
                name: runkod
                port:
                  number: 8080
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: runkod
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: runko-web
  namespace: maas-dev
  labels:
    app.kubernetes.io/part-of: monorepo-platform
spec:
  ingressClassName: nginx
  rules:
    - host: runko.k8s.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: runko-web
                port:
                  number: 80
    - host: runko.victornazzaro.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: runko-web
                port:
                  number: 80
