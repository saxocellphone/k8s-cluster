# runko-deployer shared webhook HMAC secret (inverted CD trigger, Runko
# §14.10): runkod's outbox signs deploy.images_ready with RUNKO_WEBHOOK_SECRET;
# the deployer verifies with the SAME value here. K8S_CLUSTER_TOKEN is needed
# ONLY for LIVE (non-dry-run) mode - the token the deployer pushes the digest
# pin with (a fine-grained PAT, Contents:write on this repo). Add it and flip
# RUNKO_DEPLOYER_DRY_RUN off to go live.
# Edit via: SOPS_AGE_KEY_FILE=./key.txt sops apps/monorepo-platform/runko-deployer-secret.yaml
