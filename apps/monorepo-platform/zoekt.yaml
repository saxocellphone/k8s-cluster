# Zoekt shard storage. The webserver itself now runs as a sidecar in the
# runkod pod (runkod.yaml) - runkod's zoekt-git-index writes these shards
# and the webserver reads them, both bound to the same node by this RWO
# volume. The standalone Deployment/Service that used to live here served
# an empty index while the platform git service didn't exist yet; they
# are replaced by the sidecar and must be deleted manually (prune: false):
#   kubectl -n maas-dev delete deployment zoekt
#   kubectl -n maas-dev delete service zoekt
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zoekt-index
  namespace: maas-dev
  labels:
    app.kubernetes.io/part-of: monorepo-platform
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
