# runkod - the Runko write-path daemon (smart-HTTP git + pre-receive
# funnel + REST API + webhook outbox), image built by
# saxocellphone/Runko's release-images workflow.
#
# One pod, two containers, strategy Recreate - forced by storage, not
# taste: both PVCs are Longhorn RWO, and runkod's index worker
# (zoekt-git-index on trunk advance) writes the same shard directory
# zoekt-webserver serves, so indexer and webserver must share a node and
# a volume. zoekt-git-index inside the runkod image is pinned to the same
# zoekt build as the webserver image below (shard-format compatibility).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runkod
  namespace: maas-dev
  labels:
    app: runkod
    app.kubernetes.io/part-of: monorepo-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: runkod
  template:
    metadata:
      labels:
        app: runkod
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      nodeSelector:
        extensions.talos.dev/iscsi-tools: v0.2.0
      # No imagePullSecrets: the ghcr.io/saxocellphone/runko/* packages are
      # public. The scaffold's ghcr-pull secret is a placeholder whose
      # malformed dockerconfigjson makes kubelet fail the pod BEFORE even
      # attempting a pull - do not reference it unless it holds a real PAT.
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runkod
          image: ghcr.io/saxocellphone/runko/runkod:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # ORG-LESS since the default-org retirement (runkod/README.md
            # 2026-07-17): no RUNKO_REPO_DIR - the root serves only the
            # global surfaces (accounts/signup, org list/create,
            # /api/admin/*) + ops floor, and every org (runko included)
            # lives at /o/<name>/. The old root repo stays untouched on
            # the PVC at /data/git/monorepo.git; the vestigial "monorepo"
            # org row remounts as a regular (empty) org - archive it once
            # in the admin panel. Org-less mode REQUIRES an explicit
            # --orgs-dir (there is no repo to place it beside).
            - name: RUNKO_ORGS_DIR
              value: /data/git/orgs
            - name: RUNKO_ADDR
              value: 0.0.0.0:8080
            - name: RUNKO_TRUNK
              value: main
            # Inverted CD trigger (Runko §14.10): the outbox fans every event
            # (incl. deploy.images_ready) to the in-cluster runko-deployer,
            # which pins image digests into this repo's kustomization -> Argo
            # rolls. The deployer HMAC-verifies with the SAME shared secret.
            - name: RUNKO_WEBHOOK_URL
              value: http://runko-deployer:8082/webhook
            - name: RUNKO_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: runko-deployer-env
                  key: WEBHOOK_SECRET
            # Canonical landing identity (Runko docs/design.md §7.5,
            # 2026-07-13): the land engine stamps this as BOTH author and
            # committer on every landed commit, so trunk - and the GitHub
            # mirror that transports it verbatim - carry one uniform
            # identity instead of whatever git config the pushing machine
            # had (Runko / Runko Workspace / a human's varying emails).
            # Per-author attribution stays in authored_by/landed_by; this
            # is only the git-level identity. Not a secret.
            #
            # 2026-07-17: set to the runkogithubapp GitHub App's bot
            # identity, in GitHub's canonical <bot-user-id>+<slug>[bot]
            # noreply form (bot user id 306295767, resolved from
            # /users/runkogithubapp[bot]). Since the mirror now PUSHES as
            # the App (installation token), stamping the App as the commit
            # author/committer too makes GitHub render the App's avatar +
            # link on landed commits - one consistent "the App did this"
            # attribution. Same format github-actions[bot] uses.
            - name: RUNKO_LAND_IDENTITY
              value: "runkogithubapp[bot] <306295767+runkogithubapp[bot]@users.noreply.github.com>"
            - name: RUNKO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: runkod-env
                  key: RUNKO_TOKEN
            # Named principals (§15.1 interim registry): '|'-separated
            # 'name=<n>;token=<pw>[;agent]' entries. A principal's token
            # doubles as the Basic-auth password for the web UI sign-in
            # (runkod/auth.go). Optional: the daemon runs without any, but
            # then only the anonymous deploy token can sign in.
            - name: RUNKO_PRINCIPALS
              valueFrom:
                secretKeyRef:
                  name: runkod-env
                  key: RUNKO_PRINCIPALS
                  optional: true
            # Outbound mirror (docs/mirror.md, M1 - 2026-07-08): all three
            # optional; the daemon runs mirror-less until the keys exist.
            # REMOTE/USERNAME are not secrets but live in the same SOPS
            # file so enabling the mirror is one edit. GitHub needs only
            # REMOTE + TOKEN (username defaults to x-access-token); GitLab
            # sets USERNAME=oauth2, Gitea any non-empty string.
            - name: RUNKO_MIRROR_REMOTE
              valueFrom:
                secretKeyRef:
                  name: runkod-env
                  key: RUNKO_MIRROR_REMOTE
                  optional: true
            - name: RUNKO_MIRROR_USERNAME
              valueFrom:
                secretKeyRef:
                  name: runkod-env
                  key: RUNKO_MIRROR_USERNAME
                  optional: true
            - name: RUNKO_MIRROR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: runkod-env
                  key: RUNKO_MIRROR_TOKEN
                  optional: true
            # Per-org outbound mirror (self-host R6): the 'runko' org's
            # repo mirrors to GitHub. Optional like the default-org
            # mirror trio above; the value (incl. its PAT) lives in the
            # SOPS secret.
            - name: RUNKO_ORG_MIRRORS
              valueFrom:
                secretKeyRef:
                  name: runkod-env
                  key: RUNKO_ORG_MIRRORS
                  optional: true
            # GitHub App auth (runkogithubapp, 2026-07-17): one
            # deployment-wide credential replaces per-org PATs. Any
            # github.com mirror with no static token= mints installation
            # tokens, and `runko github connect --repo <owner/name>`
            # wires an org's mirror through org settings - no more
            # RUNKO_ORG_MIRRORS editing per org. The id is not a secret;
            # the private key PEM is (secret runko-github-app, mounted
            # below).
            - name: RUNKO_GITHUB_APP_ID
              value: "4325881"
            - name: RUNKO_GITHUB_APP_KEY_FILE
              value: /secrets/github-app/github-app.pem
            # Native Mode C dispatch (runkogithubapp, 2026-07-17): the
            # outbox sends repository_dispatch to each org's connected
            # GitHub repo itself, using the App above - so the runko-bridge
            # webhook hop is retired (deployment + secret deleted). CI
            # dispatch now rides `runko github connect`; no per-org bridge,
            # no webhook URL/secret. (RUNKO_WEBHOOK_URL still exists for a
            # non-App webhook consumer, if one is ever added.)
            # CNPG auto-generated app credentials (postgres.yaml).
            - name: RUNKO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: maas-postgres-app
                  key: uri
            # Zoekt left with the default org: RUNKO_ZOEKT_INDEX_DIR
            # indexes the root repo, which org-less mode does not have -
            # setting it makes the daemon refuse to boot. Indexing was
            # default-org-only, so the index tracked the vestigial
            # monorepo repo anyway (stale for /o/runko since the
            # 2026-07-09 cutover). Search now answers a structured
            # not-configured; per-org indexing is the recorded follow-up
            # (runkod/README.md 2026-07-17). The zoekt-webserver sidecar
            # below is now idle - harmless; remove it as later cleanup.
            # Dev posture: nothing in the cluster reports checks yet, so a
            # policy-less change may land (loud opt-out, docs/design.md
            # §28.3 stage 11c). Drop this once runko-ci runs somewhere
            # (e.g. apps/actions-runner) and posts checks back.
            # RUNKO_INSECURE_ALLOW_UNPOLICED_LAND was removed 2026-07-09
            # right after the self-host cutover: the runko org's manifests
            # declare ci.checks, so real policy exists and the default-deny
            # gate is back on (Runko docs/migration-findings.md #25). The
            # import bootstrap for any FUTURE org import uses the operator
            # principal's force-land instead.
            # Self-service sign-up (§15.1): on, gated by the invite code
            # in the runkod-signup SOPS secret.
            - name: RUNKO_ALLOW_SIGNUP
              value: "true"
            - name: RUNKO_SIGNUP_CODE
              valueFrom:
                secretKeyRef:
                  name: runkod-signup
                  key: RUNKO_SIGNUP_CODE
            # Invite requests (§15.1): the ASK half of the invite code -
            # the login gate and landing page offer a public request form;
            # runko-mailer (its own Deployment) drains the rows and emails
            # the operator.
            - name: RUNKO_ALLOW_INVITE_REQUESTS
              value: "true"
            # Multi-org (§7.1): signed-in accounts may create orgs, each
            # owning its own repo under /data/git/orgs (same PVC as the
            # default repo), served at /o/<name>/.
            - name: RUNKO_ALLOW_ORG_CREATE
              value: "true"
            # git wants a HOME; point it at the writable volume root.
            - name: HOME
              value: /data
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: git-storage
              mountPath: /data/git
            - name: zoekt-index
              mountPath: /data/zoekt-index
            - name: tmp
              mountPath: /tmp
            - name: github-app
              mountPath: /secrets/github-app
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        # Same-pod zoekt-webserver reading the shards runkod writes. The
        # standalone zoekt Deployment this replaces must be deleted by
        # hand (Applications here are prune: false):
        #   kubectl -n maas-dev delete deployment zoekt; kubectl -n maas-dev delete service zoekt
        - name: zoekt-webserver
          image: ghcr.io/sourcegraph/zoekt:0.0.0-20260622122048-f80c7e09ab9d
          imagePullPolicy: IfNotPresent
          ports:
            - name: zoekt
              containerPort: 6070
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: zoekt
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: zoekt
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: zoekt-index
              mountPath: /data/index
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: git-storage
          persistentVolumeClaim:
            claimName: maas-git-storage
        - name: zoekt-index
          persistentVolumeClaim:
            claimName: zoekt-index
        - name: tmp
          emptyDir: {}
        - name: github-app
          secret:
            secretName: runko-github-app
            items:
              - key: github-app.pem
                path: github-app.pem
---
apiVersion: v1
kind: Service
metadata:
  name: runkod
  namespace: maas-dev
  labels:
    app: runkod
    app.kubernetes.io/part-of: monorepo-platform
spec:
  type: ClusterIP
  selector:
    app: runkod
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
