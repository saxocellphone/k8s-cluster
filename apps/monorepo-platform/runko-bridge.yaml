# runko-bridge - the reference §14.4 "Mode C" CI plugin: translates
# runkod's signed webhook envelopes (org `runko` only) into GitHub
# repository_dispatch events so Actions can run pre-land checks on
# refs/changes/* (which never trigger workflows natively). Ships inside
# the runkod image (same binary set); no ingress - runkod reaches it
# in-cluster at http://runko-bridge:8081/webhook, and its only egress is
# api.github.com. See Runko's docs/migration-findings.md (R2/R6).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runko-bridge
  namespace: maas-dev
  labels:
    app: runko-bridge
    app.kubernetes.io/part-of: monorepo-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: runko-bridge
  template:
    metadata:
      labels:
        app: runko-bridge
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runko-bridge
          image: ghcr.io/saxocellphone/runko/runkod:latest
          imagePullPolicy: Always
          command: ["runko-bridge"]
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          envFrom:
            - secretRef:
                name: runko-bridge-env
          # GitHub App auth (runkogithubapp, 2026-07-17): the bridge
          # mints installation tokens per dispatch with the same App
          # credential runkod holds. Mutually exclusive with
          # RUNKO_BRIDGE_GITHUB_TOKEN - that key must be REMOVED from
          # the runko-bridge-env secret (the bridge refuses both).
          env:
            - name: RUNKO_BRIDGE_GITHUB_APP_ID
              value: "4325881"
            - name: RUNKO_BRIDGE_GITHUB_APP_KEY_FILE
              value: /secrets/github-app/github-app.pem
          volumeMounts:
            - name: github-app
              mountPath: /secrets/github-app
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
      volumes:
        - name: github-app
          secret:
            secretName: runko-github-app
            items:
              - key: github-app.pem
                path: github-app.pem
---
apiVersion: v1
kind: Service
metadata:
  name: runko-bridge
  namespace: maas-dev
  labels:
    app: runko-bridge
    app.kubernetes.io/part-of: monorepo-platform
spec:
  selector:
    app: runko-bridge
  ports:
    - name: http
      port: 8081
      targetPort: http
