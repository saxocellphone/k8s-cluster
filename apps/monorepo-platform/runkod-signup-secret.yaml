# Sign-up invite code (§15.1 self-service principals). A shareable invite
# string, not a secret credential - anyone holding it can mint a principal
# on this control plane. Separate file from runkod-secret.yaml because
# adding a key to an existing SOPS file needs the age private key, which
# this machine doesn't hold; a fresh file only needs the public recipient.
