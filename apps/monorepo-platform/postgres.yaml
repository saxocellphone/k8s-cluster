# Dedicated CNPG cluster for the monorepo-platform dev environment.
# Single instance on purpose: dev profile. Bump instances + re-enable
# antiAffinity if this ever graduates beyond dev.
# CNPG auto-generates app credentials in Secret "maas-postgres-app".
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: maas-postgres
  namespace: maas-dev
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.10
  primaryUpdateMethod: switchover
  storage:
    size: 5Gi
    storageClass: longhorn
  affinity:
    nodeSelector:
      extensions.talos.dev/iscsi-tools: v0.2.0
  bootstrap:
    initdb:
      database: maas
      owner: maas
  monitoring:
    enablePodMonitor: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
