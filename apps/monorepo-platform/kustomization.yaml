  # by runkod, runko-watchdog, and runko-mailer.
  - name: ghcr.io/saxocellphone/runko/runkod
    digest: sha256:f73c36d9cdd3af9123bf1986cfbb5503713228b38727587d4f7abd7c8bcada89
  - name: ghcr.io/saxocellphone/runko/web
    digest: sha256:510923a820fed6ee8ec86e901368e47bf337b9beba81741584950a33fdda7e52
  - name: ghcr.io/saxocellphone/runko/webadmin
    digest: sha256:2972a5cc208d98de5b91bf3487c84f4738a3cbc00f5f6a3b11108d4f5ac7679e
