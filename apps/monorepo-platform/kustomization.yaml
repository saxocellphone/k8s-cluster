  # by runkod, runko-watchdog, and runko-mailer.
  - name: ghcr.io/saxocellphone/runko/runkod
    digest: sha256:466edf2fae6445c0ab6d3ea6484ce7720b40def4496b6041e42395e225d4a987
  - name: ghcr.io/saxocellphone/runko/web
    digest: sha256:3126ca49e9bf46458d2f6d06f024714b23737e8ef95b08e011169c1c6be4ec9d
  - name: ghcr.io/saxocellphone/runko/webadmin
    digest: sha256:99226cc29252772e56ec1a2737b2f46a3576d665b76e11bbd53cd4c269fafb4e
