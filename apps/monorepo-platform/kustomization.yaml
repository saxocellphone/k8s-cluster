    digest: sha256:081bb22e46e50c30c51b0850f28beb84b58469c6ca007c32b6c43dd681b14347
  - name: ghcr.io/saxocellphone/runko/web
    digest: sha256:fc6801acd6cd9e2a9219c435f646a97ba21bbf8f3d7d10770054acf7ba3ef87b
  - name: ghcr.io/saxocellphone/runko/webadmin
