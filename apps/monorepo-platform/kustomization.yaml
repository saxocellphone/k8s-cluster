apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - postgres.yaml
  - git-storage-pvc.yaml
  - zoekt.yaml
  - runkod.yaml
  - runko-watchdog.yaml
  - runko-mailer.yaml
  - web.yaml
  - web-dev.yaml
  - webadmin.yaml
  - ingress.yaml
generators:
  - ghcr-pull-secret-generator.yaml
images:
  # Digest-pinned GitOps: the runko release-images workflow's `pin` job writes
  # these digests on every land (yq), and Argo CD reconciles. runkod is shared
  # by runkod, runko-watchdog, and runko-mailer.
  - name: ghcr.io/saxocellphone/runko/runkod
    digest: sha256:e2504810e1439d705e2c9de580a410acefd8b17967a9390fcae3ae339b04bcd5
  - name: ghcr.io/saxocellphone/runko/web
    digest: sha256:eaa971332f7edbe0b4f822a37cd6c915d0f938dad2a48efea684dee7449dbadf
  - name: ghcr.io/saxocellphone/runko/webadmin
    digest: sha256:9cbfc611e76b17b3a3a2e95265f8fdb845cc830b4f33b43b4d92fea5cd5cff12
