  - name: ghcr.io/saxocellphone/runko/web
    digest: sha256:73ce33db433f74d23822e7f885bbb9c46d06a45013bf4e1b7f917c2425f307d1
  - name: ghcr.io/saxocellphone/runko/webadmin
