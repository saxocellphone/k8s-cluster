apiVersion: apps/v1
kind: Deployment
metadata:
  name: notion-writer
  namespace: openclaw
  labels:
    app: notion-writer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notion-writer
  template:
    metadata:
      labels:
        app: notion-writer
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: notion-writer
        image: python:3.12-slim
        command: ["python", "/app/server.py"]
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: NOTION_TOKEN
          valueFrom:
            secretKeyRef:
              name: openclaw-secrets
              key: NOTION_TOKEN
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: openclaw-secrets
              key: TELEGRAM_BOT_TOKEN
        - name: WEBHOOK_TOKEN
          valueFrom:
            secretKeyRef:
              name: openclaw-secrets
              key: WEBHOOK_TOKEN
        - name: NOTION_PARENT_PAGE_ID
          value: "372f88d8-7ac1-80fd-b7f1-fb2a8e4a238c"
        - name: TELEGRAM_CHAT_ID
          value: "8046271128"
        - name: PAGE_TITLE_PREFIX
          value: "Investment Briefing"
        - name: TZ
          value: "America/Los_Angeles"
        - name: PORT
          value: "8080"
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 20
        volumeMounts:
        - name: src
          mountPath: /app
      volumes:
      - name: src
        configMap:
          name: notion-writer-src
---
apiVersion: v1
kind: Service
metadata:
  name: notion-writer
  namespace: openclaw
spec:
  selector:
    app: notion-writer
  ports:
  - name: http
    port: 80
    targetPort: 8080
