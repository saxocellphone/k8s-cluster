apiVersion: apps/v1
kind: Deployment
metadata:
  name: chromium-browser
  namespace: openclaw
  annotations:
    checkov.io/skip1: CKV_K8S_40=headless-shell image runs as a low UID.
    checkov.io/skip2: CKV_K8S_43=Image uses stable channel tag.
    checkov.io/skip3: CKV_K8S_22=Chromium requires writable cache and shared memory directories.
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chromium-browser
  template:
    metadata:
      labels:
        app: chromium-browser
    spec:
      containers:
        - name: headless-shell
          image: chromedp/headless-shell:stable
          args:
            - --remote-allow-origins=*
          ports:
            - containerPort: 9222
              name: cdp
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          livenessProbe:
            tcpSocket:
              port: 9222
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 9222
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: chromium-browser
  namespace: openclaw
spec:
  selector:
    app: chromium-browser
  ports:
    - name: cdp
      port: 9222
      targetPort: 9222
