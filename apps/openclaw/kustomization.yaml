apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local nginx ingress (openclaw.k8s.home) + its TLS secret were removed: the
# Control UI is exposed only via the Cloudflare Tunnel behind CF Access, and
# the gateway uses trusted-proxy auth keyed on the CF Access identity header.
# Keeping a header-less LAN ingress would be an auth-spoofing bypass.
resources:
  - deployment.yaml
  - service.yaml
  - chromium-browser.yaml
  - notion-writer.yaml
  # Read-only ServiceAccount (bound to `view` + Argo read) for the agent's
  # Kubernetes MCP server. The hard guardrail behind observe-live / change-by-PR.
  - rbac.yaml
  # GitHub-App MCP sidecar: the agent's only write path (opens PRs). OpenClaw
  # connects to it over Streamable HTTP; it refreshes App tokens internally.
  - github-app-mcp.yaml

# Deterministic Notion writer: the morning cron job POSTs its finished briefing
# here (via --webhook); this service converts the markdown to Notion blocks and
# writes the page in code, so the agent never has to call Notion tools itself.
configMapGenerator:
  - name: notion-writer-src
    files:
      - notion-writer/server.py
  - name: github-app-mcp-src
    files:
      - github-app-mcp/server.py
  # Agent-facing CLI that calls github-app-mcp over HTTP (OpenClaw 2026.3 has no
  # in-config MCP client; see install-tools init in deployment.yaml).
  - name: openclaw-gitops-cli
    files:
      - gitops=gitops-cli.py
  # Operator persona + GitOps guardrails, seeded into the agent workspace as
  # SOUL.md by the seed-workspace init container (see deployment.yaml). Keyed as
  # SOUL.md so it lands at the filename OpenClaw injects into the system prompt.
  - name: openclaw-workspace-seed
    files:
      - SOUL.md=cluster-operator-soul.md
# Stable ConfigMap name (no hash) so the Deployment's volume reference resolves;
# the hash-name reference rewrite doesn't propagate through the KSOPS generator
# pipeline here. On server.py changes, restart the writer Deployment manually.
generatorOptions:
  disableNameSuffixHash: true

generators:
  - secret-generator.yaml
