# ROCm Kubernetes device plugin. Enumerates GPUs the kernel exposes via
# /dev/kfd and advertises them to the kubelet as `amd.com/gpu`. Pods that
# request `resources.limits."amd.com/gpu": 1` get scheduled here and the
# kubelet injects /dev/kfd + /dev/dri/renderD* into the container.
#
# Strix Halo (gfx1151) workloads also need a ROCm 6.4+ container image at
# the WORKLOAD side — the device plugin itself is GPU-arch agnostic.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: amdgpu-device-plugin
  namespace: amd-gpu-device-plugin
  labels:
    app.kubernetes.io/name: amdgpu-device-plugin
  annotations:
    checkov.io/skip1: CKV_K8S_16=Upstream ROCm device plugin requires privileged kubelet socket access.
    checkov.io/skip2: CKV_K8S_19=Device plugin uses hostNetwork per upstream ROCm pattern.
    checkov.io/skip3: CKV_K8S_20=Privileged device plugin cannot disable privilege escalation.
    checkov.io/skip4: CKV_K8S_22=Device plugin requires writable kubelet plugin socket mount.
    checkov.io/skip5: CKV_K8S_23=Device plugin runs as root per upstream pattern.
    checkov.io/skip6: CKV_K8S_28=Privileged device plugin inherits NET_RAW.
    checkov.io/skip7: CKV_K8S_29=Pod security context is incompatible with privileged device plugin.
    checkov.io/skip8: CKV_K8S_30=Container security context is incompatible with privileged device plugin.
    checkov.io/skip9: CKV_K8S_31=Seccomp profile cannot be enforced on privileged device plugin.
    checkov.io/skip10: CKV_K8S_37=Device plugin requires elevated capabilities for /sys access.
    checkov.io/skip11: CKV_K8S_40=Device plugin runs as root per upstream pattern.
    checkov.io/skip12: CKV_K8S_43=ROCm device plugin image is version-pinned.
    checkov.io/skip13: CKV_K8S_8=Device plugin has no HTTP liveness endpoint.
    checkov.io/skip14: CKV_K8S_9=Device plugin has no HTTP readiness endpoint.
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: amdgpu-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amdgpu-device-plugin
    spec:
      # Only land on nodes with an AMD GPU. Right now that's just talos-gpu-01.
      nodeSelector:
        accelerator: amd-strix-halo
      priorityClassName: system-node-critical
      tolerations:
        - key: accelerator
          operator: Equal
          value: amd-strix-halo
          effect: NoSchedule
      hostNetwork: true
      containers:
        - name: amdgpu-device-plugin
          image: rocm/k8s-device-plugin:1.31.0.0
          securityContext:
            # Needs unrestricted access to /sys and the kubelet device-plugin
            # socket dir. Privileged is the standard upstream pattern.
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: sys
              mountPath: /sys
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: sys
          hostPath:
            path: /sys
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
