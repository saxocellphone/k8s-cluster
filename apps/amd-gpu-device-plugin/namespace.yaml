apiVersion: v1
kind: Namespace
metadata:
  name: amd-gpu-device-plugin
  labels:
    # The DaemonSet runs privileged + hostPath to talk to /dev/kfd, /dev/dri,
    # and the kubelet device-plugin socket. Cluster default PodSecurity is
    # `baseline` which forbids that, so this namespace opts in to `privileged`.
    pod-security.kubernetes.io/enforce: privileged
