apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
  namespace: ai-inference
  labels:
    app: llm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llm
  template:
    metadata:
      labels:
        app: llm
    spec:
      nodeSelector:
        accelerator: amd-strix-halo
      containers:
        - name: vllm
          image: vllm/vllm-openai-rocm:latest
          imagePullPolicy: IfNotPresent
          args:
            - --model
            - Qwen/Qwen2.5-1.5B-Instruct
            - --served-model-name
            - qwen2.5-1.5b-instruct
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --download-dir
            - /models/huggingface
            - --max-model-len
            - "4096"
            - --gpu-memory-utilization
            - "0.60"
            - --dtype
            - float16
            - --trust-remote-code
          env:
            - name: HF_HOME
              value: /models/huggingface
            - name: HF_HUB_CACHE
              value: /models/huggingface/hub
            - name: HIP_VISIBLE_DEVICES
              value: "0"
            - name: HSA_OVERRIDE_GFX_VERSION
              value: "11.5.1"
            - name: HSA_ENABLE_SDMA
              value: "0"
            - name: PYTORCH_HIP_ALLOC_CONF
              value: expandable_segments:True
            - name: VLLM_USE_V1_ENGINE
              value: "0"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "4"
              memory: 12Gi
              amd.com/gpu: 1
            limits:
              cpu: "24"
              memory: 64Gi
              amd.com/gpu: 1
          securityContext:
            capabilities:
              add:
                - SYS_PTRACE
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: llm-models
              mountPath: /models
            - name: dri
              mountPath: /dev/dri
            - name: kfd
              mountPath: /dev/kfd
      volumes:
        - name: dri
          hostPath:
            path: /dev/dri
        - name: kfd
          hostPath:
            path: /dev/kfd
            type: CharDevice
        - name: llm-models
          persistentVolumeClaim:
            claimName: llm-models
