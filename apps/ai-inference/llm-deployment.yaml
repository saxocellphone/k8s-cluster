apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
  namespace: ai-inference
  labels:
    app: llm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llm
  template:
    metadata:
      labels:
        app: llm
    spec:
      nodeSelector:
        accelerator: amd-strix-halo
      initContainers:
        - name: build-strix-sglang
          image: kyuz0/vllm-therock-gfx1151:stable
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/scripts/strix-sglang-build.sh"]
          env:
            - name: HIP_VISIBLE_DEVICES
              value: "0"
            - name: HSA_OVERRIDE_GFX_VERSION
              value: "11.5.1"
            - name: HSA_ENABLE_SDMA
              value: "0"
          resources:
            requests:
              cpu: "8"
              memory: 24Gi
              amd.com/gpu: 1
            limits:
              cpu: "32"
              memory: 96Gi
              amd.com/gpu: 1
          volumeMounts:
            - name: llm-models
              mountPath: /models
            - name: dri
              mountPath: /dev/dri
            - name: kfd
              mountPath: /dev/kfd
            - name: scripts
              mountPath: /scripts
      containers:
        - name: sglang
          image: kyuz0/vllm-therock-gfx1151:stable
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/scripts/strix-sglang-serve.sh"]
          env:
            - name: SGLANG_MODEL
              value: sakamakismile/Qwen3.6-27B-Text-NVFP4-MTP
            - name: SGLANG_CONTEXT_LENGTH
              value: "8192"
            - name: SGLANG_MEM_FRACTION_STATIC
              value: "0.85"
            - name: SGLANG_MAX_RUNNING_REQUESTS
              value: "2"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              amd.com/gpu: 1
            limits:
              cpu: "32"
              memory: 96Gi
              amd.com/gpu: 1
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: llm-models
              mountPath: /models
            - name: dri
              mountPath: /dev/dri
            - name: kfd
              mountPath: /dev/kfd
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: strix-sglang-scripts
            defaultMode: 0755
        - name: dri
          hostPath:
            path: /dev/dri
        - name: kfd
          hostPath:
            path: /dev/kfd
            type: CharDevice
        - name: llm-models
          persistentVolumeClaim:
            claimName: llm-models
