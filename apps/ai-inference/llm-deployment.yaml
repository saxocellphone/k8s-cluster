apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
  namespace: ai-inference
  labels:
    app: llm
  annotations:
    checkov.io/skip1: CKV_K8S_22=ROCm inference workloads require writable model and cache directories.
    checkov.io/skip2: CKV_K8S_40=ROCm inference images run as low UIDs.
    checkov.io/skip3: CKV_K8S_43=GPU inference image is tag-pinned.
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llm
  template:
    metadata:
      labels:
        app: llm
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      nodeSelector:
        accelerator: amd-strix-halo
      tolerations:
        - key: accelerator
          operator: Equal
          value: amd-strix-halo
          effect: NoSchedule
      initContainers:
        - name: build-strix-sglang
          image: kyuz0/vllm-therock-gfx1151:stable
          imagePullPolicy: Always
          command: ["/bin/bash", "/scripts/strix-sglang-build.sh"]
          env:
            - name: HIP_VISIBLE_DEVICES
              value: "0"
            - name: HSA_OVERRIDE_GFX_VERSION
              value: "11.5.1"
            - name: HSA_ENABLE_SDMA
              value: "0"
            - name: SGLANG_HIP_CAPTURE_SINGLE_STREAM
              value: "1"
          resources:
            requests:
              cpu: "8"
              memory: 24Gi
              amd.com/gpu: 1
            limits:
              cpu: "32"
              memory: 96Gi
              amd.com/gpu: 1
          volumeMounts:
            - name: llm-models
              mountPath: /models
            - name: dri
              mountPath: /dev/dri
            - name: kfd
              mountPath: /dev/kfd
            - name: scripts
              mountPath: /scripts
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
      containers:
        - name: sglang
          image: kyuz0/vllm-therock-gfx1151:stable
          imagePullPolicy: Always
          command: ["/bin/bash", "/scripts/strix-sglang-serve.sh"]
          env:
            - name: SGLANG_MODEL
              value: Qwen/Qwen3.6-27B
            - name: SGLANG_CONTEXT_LENGTH
              value: "32768"
            - name: SGLANG_MEM_FRACTION_STATIC
              value: "0.96"
            - name: SGLANG_MAX_TOTAL_TOKENS
              value: "32768"
            - name: SGLANG_MAX_MAMBA_CACHE_SIZE
              value: "16"
            - name: SGLANG_HIP_CAPTURE_SINGLE_STREAM
              value: "1"
            - name: SGLANG_CUDA_GRAPH_MODE
              value: decode
            - name: SGLANG_CUDA_GRAPH_BS_DECODE
              value: "1"
            - name: SGLANG_CUDA_GRAPH_AUTO_FALLBACK
              value: "1"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            # talos-gpu-01 has ~32Gi system RAM shared with Strix Halo iGPU (unified
            # memory). Inflated limits (e.g. 96Gi) do not protect the host and can
            # encourage allocator blow-ups; keep limits under physical RAM so cgroup
            # pressure prefers killing the workload over wedging kubelet/apid.
            requests:
              cpu: "4"
              memory: 12Gi
              amd.com/gpu: 1
            limits:
              cpu: "24"
              memory: 28Gi
              amd.com/gpu: 1

          startupProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 20
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: llm-models
              mountPath: /models
            - name: dri
              mountPath: /dev/dri
            - name: kfd
              mountPath: /dev/kfd
            - name: scripts
              mountPath: /scripts
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
      volumes:
        - name: scripts
          configMap:
            name: strix-sglang-scripts
            defaultMode: 0755
        - name: dri
          hostPath:
            path: /dev/dri
        - name: kfd
          hostPath:
            path: /dev/kfd
            type: CharDevice
        - name: llm-models
          persistentVolumeClaim:
            claimName: llm-models
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
