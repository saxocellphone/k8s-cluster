apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - mode-switcher-rbac.yaml
  - mode-switcher.yaml
  # Shared model/cache PVC (name kept as llm-models for existing PV binding).
  - llm-pvc.yaml
  - hipfire-deployment.yaml
  - hipfire-service.yaml
  - open-webui-pvc.yaml
  - open-webui-deployment.yaml
  - open-webui-service.yaml
  - comfyui-pvc.yaml
  - comfyui-deployment.yaml
  - comfyui-service.yaml
  - ingress.yaml

configMapGenerator:
  - name: mode-switcher-src
    files:
      - server.py=mode-switcher.py

generatorOptions:
  disableNameSuffixHash: true
