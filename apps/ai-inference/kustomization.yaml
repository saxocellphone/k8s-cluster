apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - mode-switcher-rbac.yaml
  - mode-switcher.yaml
  - llm-pvc.yaml
  - llm-deployment.yaml
  - llm-service.yaml
  - comfyui-pvc.yaml
  - comfyui-deployment.yaml
  - comfyui-service.yaml
  - ingress.yaml

configMapGenerator:
  - name: mode-switcher-src
    files:
      - server.py=mode-switcher.py

generatorOptions:
  disableNameSuffixHash: true
