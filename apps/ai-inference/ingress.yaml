apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-inference
  namespace: ai-inference
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: ai.k8s.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mode-switcher
                port:
                  number: 8080
    - host: llm.k8s.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: llm
                port:
                  number: 8080
    - host: chat.k8s.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: open-webui
                port:
                  number: 8080
    - host: comfyui.k8s.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: comfyui
                port:
                  number: 8188
