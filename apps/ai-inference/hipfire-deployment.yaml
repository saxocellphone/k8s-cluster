apiVersion: apps/v1
kind: Deployment
metadata:
  name: hipfire
  namespace: ai-inference
  labels:
    app: hipfire
  annotations:
    checkov.io/skip1: CKV_K8S_22=ROCm inference workloads require writable model and cache directories.
    checkov.io/skip2: CKV_K8S_40=ROCm inference images run as low UIDs.
    checkov.io/skip3: CKV_K8S_43=Custom GPU image is tag-pinned.
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hipfire
  template:
    metadata:
      labels:
        app: hipfire
    spec:
      imagePullSecrets:
      - name: ghcr-saxocellphone
      nodeSelector:
        accelerator: amd-strix-halo
      tolerations:
      - key: accelerator
        operator: Equal
        value: amd-strix-halo
        effect: NoSchedule
      # llm-models PVC is shared with SGLang; dirs may be root-owned. HIPFire runs
      # as 10001 and writes $HIPFIRE_HOME under /models/hipfire-home — without this
      # init, serve dies immediately with EACCES on config.json.
      initContainers:
      - name: fix-hipfire-home-perms
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          set -eu
          # Writable tree for UID 10001 (HIPFire + ROCm/HIP caches). Shared PVC
          # often has root-owned paths from other GPU workloads.
          for d in \
            /models/hipfire-home \
            /models/hipfire-home/.cache \
            /models/hipfire-home/.hipfire \
            /models/hipfire-home/.local \
            /models/hipfire-home/tmp
          do
            mkdir -p "$d"
          done
          chown -R 10001:10001 /models/hipfire-home
          chmod -R u+rwX,g+rwX /models/hipfire-home
        volumeMounts:
        - name: llm-models
          mountPath: /models
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - FOWNER
            - DAC_OVERRIDE
      containers:
      - name: hipfire
        image: ghcr.io/saxocellphone/hipfire-gfx1151:latest
        imagePullPolicy: Always
        env:
        - name: HIPFIRE_MODEL
          value: qwen3.6:27b
        - name: HIPFIRE_HOME
          value: /models/hipfire-home
        # Keep ROCm/HIP/tmp off the read-only image rootfs and root-owned /tmp.
        - name: HOME
          value: /models/hipfire-home
        - name: XDG_CACHE_HOME
          value: /models/hipfire-home/.cache
        - name: XDG_CONFIG_HOME
          value: /models/hipfire-home/.config
        - name: TMPDIR
          value: /models/hipfire-home/tmp
        - name: HIP_USER_CACHE
          value: /models/hipfire-home/.cache/hip
        - name: ROCM_PATH
          value: /opt/rocm
        ports:
        - name: http
          containerPort: 11435
          protocol: TCP
        resources:
          requests:
            cpu: "4"
            memory: 8Gi
            amd.com/gpu: 1
          limits:
            cpu: "24"
            memory: 64Gi
            amd.com/gpu: 1
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 20
          failureThreshold: 180
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          failureThreshold: 3
        volumeMounts:
        - name: llm-models
          mountPath: /models
        - name: dri
          mountPath: /dev/dri
        - name: kfd
          mountPath: /dev/kfd
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 10001
          capabilities:
            drop:
            - ALL
      volumes:
      - name: dri
        hostPath:
          path: /dev/dri
      - name: kfd
        hostPath:
          path: /dev/kfd
          type: CharDevice
      - name: llm-models
        persistentVolumeClaim:
          claimName: llm-models
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
