apiVersion: apps/v1
kind: Deployment
metadata:
  name: hipfire
  namespace: ai-inference
  labels:
    app: hipfire
  annotations:
    checkov.io/skip1: CKV_K8S_22=ROCm inference workloads require writable model and cache directories.
    checkov.io/skip2: CKV_K8S_40=ROCm inference images run as low UIDs.
    checkov.io/skip3: CKV_K8S_43=Custom GPU image is tag-pinned.
spec:
  # Default AI mode for the lab (OpenCode points here). Mode-switcher may scale
  # this to 0 when switching to comfy/wolf — intentional exclusivity on the GPU node.
  replicas: 1

  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hipfire
  template:
    metadata:
      labels:
        app: hipfire
    spec:
      imagePullSecrets:
      - name: ghcr-saxocellphone
      nodeSelector:
        accelerator: amd-strix-halo
      tolerations:
      - key: accelerator
        operator: Equal
        value: amd-strix-halo
        effect: NoSchedule
      # llm-models PVC holds models/caches; dirs may be root-owned. HIPFire runs
      # as 10001 and writes $HIPFIRE_HOME under /models/hipfire-home — without this
      # init, serve dies immediately with EACCES on config.json.

      initContainers:
      - name: fix-hipfire-home-perms
        image: busybox:1.38
        command:
        - sh
        - -c
        - |
          set -eu
          # Writable tree for UID 10001 (HIPFire + ROCm/HIP caches). Shared PVC
          # often has root-owned paths from other GPU workloads.
          for d in \
            /models/hipfire-home \
            /models/hipfire-home/.cache \
            /models/hipfire-home/.cache/hip \
            /models/hipfire-home/.hipfire \
            /models/hipfire-home/.hipfire_kernels \
            /models/hipfire-home/.local \
            /models/hipfire-home/tmp
          do
            mkdir -p "$d"
          done
          chown -R 10001:10001 /models/hipfire-home
          chmod -R u+rwX,g+rwX /models/hipfire-home
        volumeMounts:
        - name: llm-models
          mountPath: /models
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - FOWNER
            - DAC_OVERRIDE
      containers:
      - name: hipfire
        image: ghcr.io/saxocellphone/hipfire-gfx1151:latest
        imagePullPolicy: Always
        # Repo hipfire-serve.sh (MQ6 default, idle_timeout=0, pull on miss).
        command: ["/bin/bash", "/scripts/hipfire-serve.sh"]
        # Image CMD does not cd; daemon creates $CWD/.hipfire_kernels unless
        # HIPFIRE_KERNEL_CACHE is set. Default CWD is / (not writable for 10001).
        workingDir: /models/hipfire-home
        env:
        # HIPFire has no true FP16 serve path (engine is MQ* quant). MQ6 is the
        # highest-quality 27B class tag available (~21GB weights; uses more UMA FB
        # than default MQ4 ~15GB). Pull on first start if missing (see hipfire-serve.sh).
        - name: HIPFIRE_MODEL
          value: qwen3.5:27b-mq6
        - name: HIPFIRE_HOME
          value: /models/hipfire-home

        # Keep ROCm/HIP/tmp off the read-only image rootfs and root-owned /tmp.
        - name: HOME
          value: /models/hipfire-home
        - name: XDG_CACHE_HOME
          value: /models/hipfire-home/.cache
        - name: XDG_CONFIG_HOME
          value: /models/hipfire-home/.config
        - name: TMPDIR
          value: /tmp
        - name: HIP_USER_CACHE
          value: /models/hipfire-home/.cache/hip
        - name: HIPFIRE_KERNEL_CACHE
          value: /models/hipfire-home/.hipfire_kernels
        - name: ROCM_PATH
          value: /opt/rocm
        ports:
        - name: http
          containerPort: 11435
          protocol: TCP
        resources:
          # Cap under talos-gpu-01 physical RAM (~32Gi unified with iGPU) so OOM
          # prefers this container over a host-level hang (see GpuNodeNotReady alert).
          requests:
            cpu: "4"
            memory: 8Gi
            amd.com/gpu: 1
          limits:
            cpu: "24"
            memory: 28Gi
            amd.com/gpu: 1

        # First start may hipfire pull ~20GB MQ6 — allow ~2h startup.
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 20
          failureThreshold: 360
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          failureThreshold: 3
        volumeMounts:
        - name: llm-models
          mountPath: /models
        # ROCm/HIP often writes caches under /tmp regardless of HOME; image /tmp
        # is root-owned and not writable for UID 10001.
        - name: tmp
          mountPath: /tmp
        - name: dri
          mountPath: /dev/dri
        - name: kfd
          mountPath: /dev/kfd
        - name: hipfire-serve-script
          mountPath: /scripts
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 10001
          capabilities:
            drop:
            - ALL
      volumes:
      - name: dri
        hostPath:
          path: /dev/dri
      - name: kfd
        hostPath:
          path: /dev/kfd
          type: CharDevice
      - name: llm-models
        persistentVolumeClaim:
          claimName: llm-models
      - name: tmp
        emptyDir:
          sizeLimit: 8Gi
      - name: hipfire-serve-script
        configMap:
          name: hipfire-serve-script
          defaultMode: 0755
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch

        # Host render/video GIDs for /dev/kfd + /dev/dri (pod-level only; not valid on containers).
        supplementalGroups:
        - 44
        - 109
        - 110
        - 992
        seccompProfile:
          type: RuntimeDefault
