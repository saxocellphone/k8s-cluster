apiVersion: v1
kind: ServiceAccount
metadata:
  name: mode-switcher
  namespace: ai-inference
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mode-switcher
  namespace: ai-inference
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    # Must match WORKLOADS in mode-switcher.py. vllm/qwen-full added so the
    # switcher can drain them — otherwise they hold the GPU and gaming mode
    # never schedules.
    resourceNames: ["hipfire", "comfyui", "vllm", "qwen-full"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mode-switcher
  namespace: ai-inference
subjects:
  - kind: ServiceAccount
    name: mode-switcher
    namespace: ai-inference
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mode-switcher
---
# Read GPU node Ready/taints so we refuse mode scale-up while talos-gpu-01 is wedged.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mode-switcher-node-read
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    resourceNames: ["talos-gpu-01"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mode-switcher-node-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mode-switcher-node-read
subjects:
  - kind: ServiceAccount
    name: mode-switcher
    namespace: ai-inference
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-mode-switcher-gaming
  namespace: gaming
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    resourceNames: ["wolf"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-mode-switcher-gaming
  namespace: gaming
subjects:
  - kind: ServiceAccount
    name: mode-switcher
    namespace: ai-inference
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-mode-switcher-gaming
