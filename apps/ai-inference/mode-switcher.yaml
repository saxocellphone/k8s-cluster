apiVersion: apps/v1
kind: Deployment
metadata:
  name: mode-switcher
  namespace: ai-inference
  labels:
    app: mode-switcher
  annotations:
    checkov.io/skip1: CKV_K8S_22=python:slim needs writable temp for stdlib-only service.
    checkov.io/skip2: CKV_K8S_38=Service account token is required for Kubernetes Apps API access.
    checkov.io/skip3: CKV_K8S_43=python base image is tag-pinned.
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mode-switcher
  template:
    metadata:
      labels:
        app: mode-switcher
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      serviceAccountName: mode-switcher
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mode-switcher
          image: python:3.14-slim
          command: ["python", "/app/server.py"]
          env:
            - name: NAMESPACE
              value: ai-inference
            - name: PORT
              value: "8080"
            # Serialize GPU modes: drain → cooldown → scale-up (see mode-switcher.py).
            - name: GPU_NODE
              value: talos-gpu-01
            - name: DRAIN_TIMEOUT_SEC
              value: "300"
            - name: COOLDOWN_SEC
              value: "60"
            - name: POLL_SEC
              value: "3"
          ports:
            - name: http
              containerPort: 8080
          # /healthz avoids blocking probes during a long drain POST on /
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            # Mode switches can hold the process for drain+cooldown; allow headroom.
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # Drains are synchronous in one request thread; keep memory modest.
              memory: 256Mi

          volumeMounts:
            - name: src
              mountPath: /app
          imagePullPolicy: Always
      volumes:
        - name: src
          configMap:
            name: mode-switcher-src
---
apiVersion: v1
kind: Service
metadata:
  name: mode-switcher
  namespace: ai-inference
spec:
  selector:
    app: mode-switcher
  ports:
    - name: http
      port: 8080
      targetPort: http
