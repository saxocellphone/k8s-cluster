apiVersion: apps/v1
kind: Deployment
metadata:
  name: mode-switcher
  namespace: ai-inference
  labels:
    app: mode-switcher
  annotations:
    checkov.io/skip1: CKV_K8S_22=python:slim needs writable temp for stdlib-only service.
    checkov.io/skip2: CKV_K8S_38=Service account token is required for Kubernetes Apps API access.
    checkov.io/skip3: CKV_K8S_43=python base image is tag-pinned.
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mode-switcher
  template:
    metadata:
      labels:
        app: mode-switcher
    spec:
      serviceAccountName: mode-switcher
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mode-switcher
          image: python:3.14-slim
          command: ["python", "/app/server.py"]
          env:
            - name: NAMESPACE
              value: ai-inference
            - name: PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: src
              mountPath: /app
          imagePullPolicy: Always
      volumes:
        - name: src
          configMap:
            name: mode-switcher-src
---
apiVersion: v1
kind: Service
metadata:
  name: mode-switcher
  namespace: ai-inference
spec:
  selector:
    app: mode-switcher
  ports:
    - name: http
      port: 8080
      targetPort: http
