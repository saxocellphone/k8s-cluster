apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfyui
  namespace: ai-inference
  labels:
    app: comfyui
  annotations:
    checkov.io/skip1: CKV_K8S_22=ComfyUI requires writable output and cache directories.
    checkov.io/skip2: CKV_K8S_40=ComfyUI image runs as a low UID.
    checkov.io/skip3: CKV_K8S_43=Image is tag-pinned.
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: comfyui
  template:
    metadata:
      labels:
        app: comfyui
    spec:
      nodeSelector:
        accelerator: amd-strix-halo
      tolerations:
        - key: accelerator
          operator: Equal
          value: amd-strix-halo
          effect: NoSchedule
      containers:
        - name: comfyui
          image: ignatberesnev/comfyui-gfx1151:v0.2
          imagePullPolicy: Always
          env:
            - name: HSA_OVERRIDE_GFX_VERSION
              value: "11.5.1"
            - name: HIP_VISIBLE_DEVICES
              value: "0"
            - name: TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL
              value: "1"
          ports:
            - name: http
              containerPort: 8188
              protocol: TCP
          resources:
            requests:
              cpu: "4"
              memory: 12Gi
              amd.com/gpu: 1
            limits:
              cpu: "16"
              memory: 28Gi
              amd.com/gpu: 1
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: comfyui-data
              mountPath: /opt/ComfyUI
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
      volumes:
        - name: comfyui-data
          persistentVolumeClaim:
            claimName: comfyui-data
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
