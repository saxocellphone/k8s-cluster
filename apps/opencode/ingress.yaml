# Public hostname rides CF tunnel (DNS + wildcard → ingress-nginx).
# Auth is Cloudflare Access only (OAuth / email allow-list) — OpenCode has no
# basic auth. No LAN host (would bypass Access and expose a privileged DinD pod).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opencode
  namespace: opencode
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # Agent turns + SSE (/global/event) need long-lived connections.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: opencode.victornazzaro.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opencode
                port:
                  number: 4096
