# Public hostname rides CF tunnel wildcard (*.victornazzaro.com → ingress-nginx).
# Protect with Cloudflare Access (terraform) + OPENCODE_SERVER_PASSWORD basic auth.
# No header-less "LAN only is fine" assumption for the public host — Access is required off-LAN.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opencode
  namespace: opencode
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # Agent turns + SSE (/global/event) need long-lived connections.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: opencode.victornazzaro.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opencode
                port:
                  number: 4096
    # Optional LAN host for home network debugging (still has basic auth).
    - host: opencode.k8s.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opencode
                port:
                  number: 4096
