apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-config
  namespace: opencode
data:
  # Non-secret base; init container injects X-MCP-Token from secret into mcp.headers.
  # PR-only GitHub path: remote MCP → github-app-mcp.openclaw (GitHub App, not PAT).
  opencode.json.tmpl: |
    {
      "$schema": "https://opencode.ai/config.json",
      "provider": {
        "cluster-llm": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "Cluster LLM",
          "options": {
            "baseURL": "http://llm.ai-inference.svc.cluster.local:8080/v1"
          },
          "models": {
            "local-default": {
              "name": "local-default"
            }
          }
        }
      },
      "mcp": {
        "github-app": {
          "type": "remote",
          "enabled": true,
          "url": "http://github-app-mcp.openclaw.svc.cluster.local/mcp",
          "headers": {
            "X-MCP-Token": "__GITHUB_MCP_TOKEN__"
          }
        }
      }
    }
  AGENTS.md: |
    # OpenCode cluster sandbox (observe live / change by PR)

    You run in a long-lived Kubernetes pod (`opencode` namespace) with Docker-in-Docker
    and a **read-only** in-cluster ServiceAccount (same model as OpenClaw).

    ## The one rule

    **Argo CD reconciles `saxocellphone/k8s-cluster` (`main`) with `selfHeal: true`.**

    You have two powers — do not confuse them:

    1. **OBSERVE** — use `kubectl` (`get` / `describe` / `logs` / events) and read Argo
       Applications. Broad non-secret cluster read is allowed. Your token cannot
       mutate the API (writes return 403). Never try to work around that.
    2. **CHANGE** — durable fixes go through the **GitHub App MCP** tools
       (`github-app` MCP server): open a **pull request** against `main` on
       `saxocellphone/k8s-cluster`. The operator reviews and merges; Argo applies.

    **Never** `kubectl apply` / `edit` / `delete` / `scale` / `exec` / port-forward,
    never read Secrets, never push directly to `main`, never install a personal
    GitHub PAT into this environment for pushing. There is **no** `GITHUB_TOKEN`
    for write access on purpose.

    Local edits under `/workspace` are fine for exploration; they are not live
    until a PR is merged.

    ## How a change reaches the cluster

    1. Diagnose from the live cluster.
    2. Identify manifests under `apps/`, `cluster/`, or `infrastructure/`.
    3. Use GitHub App MCP tools to open a PR (branch off `main`, never commit to `main`).
    4. PR description: what/why, which Argo Application owns the files, post-merge
       verification (`kubectl get app <name> -n argocd`).
    5. Stop after the PR is open — the user merges.

    ## Repo conventions (GitOps)

    - Plain apps: `argocd/apps/*` → Kustomize under `apps/` or `cluster/`.
    - Infra Helm: edit `infrastructure/<name>/values.yaml` only — do not vendor charts.
    - `prune: false` on workloads — deleting a file does not delete the live object.
    - Storage: prefer `nfs-client` for config; `longhorn` for write-heavy + nodeSelector
      `extensions.talos.dev/iscsi-tools`. No `local-storage` on Talos.
    - Secrets: never put real secret values in a PR; use placeholders and tell the user
      to `sops` encrypt.

    ## Tools on this sandbox

    - `kubectl` uses the in-cluster read-only SA automatically.
    - `git` / `gh` may be present for **read-only** clone of public repos; do not rely on
      them for authenticated push. Prefer GitHub App MCP for PR creation.
    - Docker is available for builds/tests inside the sandbox only.

    ## Safety

    This pod is privileged (DinD). Treat it as a single-tenant workstation for the
    operator, but **cluster and Git `main` authority** are still PR-only / read-only.
