apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-config
  namespace: opencode
data:
  # Seeded on each pod start into /workspace/.home/.config/opencode/opencode.json
  # HIPFire MQ6 27B (best quality registry tag; not true FP16 — engine is MQ-only).
  opencode.json.tmpl: |
    {
      "$schema": "https://opencode.ai/config.json",
      "model": "qwen-full/qwen-qwen2.5-27b-instruct",
      "provider": {
        "qwen-full": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "Qwen BF16 (Transformers/ROCm)",
          "options": {
            "baseURL": "http://qwen-full.ai-inference.svc.cluster.local:8000/v1"
          },
          "models": {
            "qwen-qwen2.5-27b-instruct": {
              "name": "Qwen2.5-27B-Instruct BF16",
              "limit": {
                "context": 8192,
                "output": 2048
              }
            }
          }
        },
        "hipfire": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "HIPFire (MQ quant)",
          "options": {
            "baseURL": "http://hipfire.ai-inference.svc.cluster.local:11435/v1"
          },
          "models": {
            "qwen3.5-27b.mq6": {
              "name": "qwen3.5-27b.mq6",
              "limit": {
                "context": 32768,
                "output": 4096
              }
            },
            "qwen3.6-27b.mq4": {
              "name": "qwen3.6-27b.mq4",
              "limit": {
                "context": 32768,
                "output": 4096
              }
            }
          }
        }
      },
      "mcp": {

        "github-app": {
          "type": "remote",
          "enabled": true,
          "url": "http://github-app-mcp.openclaw.svc.cluster.local/mcp",
          "headers": {
            "X-MCP-Token": "__GITHUB_MCP_TOKEN__"
          }
        }
      }
    }
  AGENTS.md: |
    # OpenCode cluster sandbox (observe live / change by PR)

    ## Model

    Default in-cluster provider is **HIPFire** (AMD MQ quant engine — **not** FP16):
    - Provider id: `hipfire`
    - API: `http://hipfire.ai-inference.svc.cluster.local:11435/v1`
    - Preferred model: `qwen3.5-27b.mq6` (`HIPFIRE_MODEL=qwen3.5:27b-mq6`) — highest-quality
      **27B-class** tag HIPFire ships (~21GB weights; uses more of the ~96GiB UMA FB than MQ4).
    - Fallback id if still on old weights: `qwen3.6-27b.mq4`
    - Confirm live id: `GET /v1/models` on the hipfire Service.

    True unquantized (BF16/FP16) Qwen is **not** a HIPFire `serve`/`pull` path; use MQ6
    (or quantize via `hipfire quantize` offline) to spend more FB quality budget.

    Enable HIPFire with mode-switcher **hipfire** mode when the GPU node is Ready.

    Cloud providers may appear only if API keys are set in the pod env; prefer
    HIPFire unless the GPU node is down.

    You run in a long-lived Kubernetes pod (`opencode` namespace) with Docker-in-Docker
    and a **read-only** in-cluster ServiceAccount (same model as OpenClaw).

    ## Kubernetes context — confirm the *correct* cluster

    This repository is **homelab GitOps** (`saxocellphone/k8s-cluster`) for **one**
    specific cluster. Wrong-cluster applies are a critical incident risk.

    - Prefer **`kubectl --kubeconfig=./kubeconfig`** when a file kubeconfig is in play,
      or the **in-cluster ServiceAccount** in this OpenCode pod.
    - Before kubectl/helm on a laptop/CI kubeconfig, verify context / nodes / cluster-info
      match this lab (`README.md`). If clearly a **different** cluster, **stop**.

    ## The one rule

    **Argo CD reconciles `saxocellphone/k8s-cluster` (`main`) with `selfHeal: true`.**

    1. **OBSERVE** — read-only `kubectl` (no secrets, no mutate).
    2. **CHANGE** — GitHub App MCP → **PR** only; never push `main` / never PAT.

    Prefer GitHub App MCP for PRs. Docker available for sandbox builds/tests.
