apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-config
  namespace: opencode
data:
  # Seeded on each pod start into /workspace/.home/.config/opencode/opencode.json
  # Default: vLLM BF16 Qwen3.6-27B (Service must be vllm-openai, not "vllm" — VLLM_PORT k8s clash).
  opencode.json.tmpl: |
    {
      "$schema": "https://opencode.ai/config.json",
      "model": "vllm/Qwen/Qwen3.6-27B",
      "provider": {
        "vllm": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "vLLM BF16 (ROCm Navi/gfx1151)",
          "options": {
            "baseURL": "http://vllm-openai.ai-inference.svc.cluster.local:8000/v1"
          },
          "models": {
            "Qwen/Qwen3.6-27B": {
              "name": "Qwen3.6-27B BF16 (vLLM)",
              "limit": {
                "context": 65536,
                "output": 8192
              }
            }
          }
        },
        "qwen-full": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "Qwen BF16 (Transformers/ROCm)",
          "options": {
            "baseURL": "http://qwen-full.ai-inference.svc.cluster.local:8000/v1"
          },
          "models": {
            "qwen-qwen2.5-14b-instruct": {
              "name": "Qwen2.5-14B-Instruct BF16 (Transformers/ROCm)",
              "limit": {
                "context": 8192,
                "output": 2048
              }
            }
          }
        },
        "hipfire": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "HIPFire (MQ quant)",
          "options": {
            "baseURL": "http://hipfire.ai-inference.svc.cluster.local:11435/v1"
          },
          "models": {
            "qwen3.5-27b.mq6": {
              "name": "qwen3.5-27b.mq6",
              "limit": {
                "context": 32768,
                "output": 4096
              }
            },
            "qwen3.6-27b.mq4": {
              "name": "qwen3.6-27b.mq4",
              "limit": {
                "context": 32768,
                "output": 4096
              }
            }
          }
        }
      },
      "mcp": {

        "github-app": {
          "type": "remote",
          "enabled": true,
          "url": "http://github-app-mcp.openclaw.svc.cluster.local/mcp",
          "headers": {
            "X-MCP-Token": "__GITHUB_MCP_TOKEN__"
          }
        }
      }
    }
  AGENTS.md: |
    # OpenCode cluster sandbox (observe live / change by PR)

    ## Model

    Default in-cluster provider is **vLLM** (BF16, AMD gfx1151 ROCm image):
    - Provider id: `vllm`
    - OpenCode model: `vllm/Qwen/Qwen3.6-27B`
    - API: `http://vllm-openai.ai-inference.svc.cluster.local:8000/v1`
      (Service is named **`vllm-openai`** on purpose — a Service named `vllm` injects
      `VLLM_PORT=tcp://…` and breaks the engine.)
    - Confirm live: `GET /v1/models` on that Service (expect id `Qwen/Qwen3.6-27B`).
    - Only one GPU owner on `talos-gpu-01`: scale **hipfire / qwen-full / comfyui to 0**
      while `vllm` is up.

    Fallbacks (other providers in `opencode.json`, exclusive GPU — not simultaneous):
    - **HIPFire** (MQ quant, not BF16): `hipfire/qwen3.5-27b.mq6` or `hipfire/qwen3.6-27b.mq4`
      at `http://hipfire.ai-inference.svc.cluster.local:11435/v1`
    - **qwen-full** (DIY Transformers BF16): only if that Deployment is scaled up

    Cloud providers may appear only if API keys are set in the pod env; prefer
    in-cluster vLLM when the GPU node is Ready and `vllm` is running.

    You run in a long-lived Kubernetes pod (`opencode` namespace) with Docker-in-Docker
    and a **read-only** in-cluster ServiceAccount (same model as OpenClaw).

    ## Kubernetes context — confirm the *correct* cluster

    This repository is **homelab GitOps** (`saxocellphone/k8s-cluster`) for **one**
    specific cluster. Wrong-cluster applies are a critical incident risk.

    - Prefer **`kubectl --kubeconfig=./kubeconfig`** when a file kubeconfig is in play,
      or the **in-cluster ServiceAccount** in this OpenCode pod.
    - Before kubectl/helm on a laptop/CI kubeconfig, verify context / nodes / cluster-info
      match this lab (`README.md`). If clearly a **different** cluster, **stop**.

    ## The one rule

    **Argo CD reconciles `saxocellphone/k8s-cluster` (`main`) with `selfHeal: true`.**

    1. **OBSERVE** — read-only `kubectl` (no secrets, no mutate).
    2. **CHANGE** — GitHub App MCP → **PR** only; never push `main` / never PAT.

    Prefer GitHub App MCP for PRs. Docker available for sandbox builds/tests.
