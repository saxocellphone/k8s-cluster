apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - rbac.yaml
  - pvc-workspace.yaml
  - pvc-docker.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - configmap-opencode-json.yaml
  - github-app-mcp.yaml

configMapGenerator:
  - name: opencode-entrypoint
    files:
      - entrypoint.sh
    options:
      disableNameSuffixHash: true
  - name: github-app-mcp-src
    files:
      - github-app-mcp/server.py
    options:
      disableNameSuffixHash: true

generators:
  - secret-generator.yaml

