# OpenCode multi-client server in a real Ubuntu dev sandbox (git+https, ssh, build-essential)
# + DinD sidecar. Docs: https://opencode.ai/docs/server/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: opencode
  labels:
    app: opencode
  annotations:
    checkov.io/skip1: CKV_K8S_16=DinD requires privileged for nested Docker.
    checkov.io/skip2: CKV_K8S_20=Privileged DinD cannot disable privilege escalation.
    checkov.io/skip3: CKV_K8S_22=Workspace and Docker data need writable volumes.
    checkov.io/skip4: CKV_K8S_23=Sandbox runs as root to share docker.sock with DinD.
    checkov.io/skip5: CKV_K8S_28=Privileged inherits NET_RAW.
    checkov.io/skip6: CKV_K8S_29=Pod security context incompatible with privileged DinD.
    checkov.io/skip7: CKV_K8S_30=Container security context incompatible with privileged DinD.
    checkov.io/skip8: CKV_K8S_31=Seccomp cannot be RuntimeDefault on privileged DinD.
    checkov.io/skip9: CKV_K8S_37=Elevated capabilities required for DinD.
    checkov.io/skip10: CKV_K8S_40=Root required for docker.sock and apt in entrypoint.
    checkov.io/skip11: CKV_K8S_8=DinD has no HTTP probes; opencode container is probed.
    checkov.io/skip12: CKV_K8S_9=DinD has no readiness HTTP; opencode container is probed.
    checkov.io/skip13: CKV_K8S_35=API keys required as env vars by OpenCode providers.
    checkov.io/skip14: CKV_K8S_43=Ubuntu base is tag-pinned; OpenCode version via OPENCODE_VERSION.
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: opencode
  template:
    metadata:
      labels:
        app: opencode
    spec:
      serviceAccountName: opencode
      nodeSelector:
        extensions.talos.dev/iscsi-tools: v0.2.0
      terminationGracePeriodSeconds: 60
      initContainers:
        # Static CLIs only (kubectl, docker, gh). Full git comes from Ubuntu image + entrypoint apt.
        - name: seed-tools
          image: alpine:3.21
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eux
              apk add --no-cache curl tar gzip ca-certificates
              mkdir -p /tools/bin
              KVER=v1.34.1
              curl -fsSL "https://dl.k8s.io/release/${KVER}/bin/linux/amd64/kubectl" \
                -o /tools/bin/kubectl
              chmod +x /tools/bin/kubectl
              DOCKER_VER=27.5.1
              curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_VER}.tgz" \
                | tar -xz -C /tmp
              mv /tmp/docker/docker /tools/bin/docker
              GH_VER=2.67.0
              curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VER}/gh_${GH_VER}_linux_amd64.tar.gz" \
                | tar -xz -C /tmp
              mv "/tmp/gh_${GH_VER}_linux_amd64/bin/gh" /tools/bin/gh
              # Optional: pin OpenCode binary next to tools so entrypoint can use it offline-ish.
              OC_VER=1.17.11
              curl -fsSL "https://github.com/anomalyco/opencode/releases/download/v${OC_VER}/opencode-linux-x64.tar.gz" \
                -o /tmp/oc.tgz \
                || curl -fsSL "https://github.com/sst/opencode/releases/download/v${OC_VER}/opencode-linux-x64.tar.gz" \
                -o /tmp/oc.tgz || true
              if [ -f /tmp/oc.tgz ]; then
                tar -xzf /tmp/oc.tgz -C /tmp
                OC_BIN="$(find /tmp -type f -name opencode 2>/dev/null | head -1 || true)"
                if [ -n "$OC_BIN" ]; then
                  install -m 0755 "$OC_BIN" /tools/bin/opencode
                fi
              fi
              chmod -R a+rX /tools
          volumeMounts:
            - name: tools
              mountPath: /tools
        - name: seed-workspace
          # Ubuntu so git clone uses full git+https (same family as main sandbox).
          image: ubuntu:24.04
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-ec"]
          args:
            - |
              set -eux
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends ca-certificates git
              mkdir -p /workspace/repos \
                /workspace/.home/.config/opencode \
                /workspace/.home/.local/share/opencode
              if [ -f /seed/AGENTS.md ]; then
                cp /seed/AGENTS.md /workspace/AGENTS.md
              fi
              if [ -f /seed/opencode.json.tmpl ]; then
                TOKEN="${GITHUB_MCP_TOKEN:-}"
                sed "s|__GITHUB_MCP_TOKEN__|${TOKEN}|g" /seed/opencode.json.tmpl \
                  > /workspace/.home/.config/opencode/opencode.json
              fi
              touch /workspace/repos/.keep
              if [ ! -d /workspace/repos/k8s-cluster/.git ]; then
                git clone --depth 1 https://github.com/saxocellphone/k8s-cluster.git \
                  /workspace/repos/k8s-cluster
              fi
          env:
            - name: GITHUB_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opencode-secrets
                  key: GITHUB_MCP_TOKEN
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: config-seed
              mountPath: /seed
              readOnly: true
      containers:
        - name: dind
          image: docker:29-dind
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          command: ["dockerd"]
          args:
            - --host=unix:///var/run/docker.sock
            - --data-root=/var/lib/docker
            - --exec-root=/var/run/docker/execroot
            - --pidfile=/var/run/docker.pid
            - --mtu=1450
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 8Gi
          volumeMounts:
            - name: docker-run
              mountPath: /var/run
            - name: docker-data
              mountPath: /var/lib/docker
        - name: opencode
          # Full userspace: apt git (with remote-https), ssh, build-essential via entrypoint.
          image: ubuntu:24.04
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          command: ["/bin/bash", "/entrypoint/entrypoint.sh"]
          ports:
            - name: http
              containerPort: 4096
              protocol: TCP
          env:
            - name: HOME
              value: /workspace/.home
            - name: PATH
              value: /tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
            - name: OPENCODE_VERSION
              value: "1.17.11"
            - name: OPENCODE_SERVER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: opencode-secrets
                  key: OPENCODE_SERVER_USERNAME
            - name: OPENCODE_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencode-secrets
                  key: OPENCODE_SERVER_PASSWORD
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: opencode-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: opencode-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: XAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: opencode-secrets
                  key: XAI_API_KEY
                  optional: true
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 8Gi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: docker-run
              mountPath: /var/run
            - name: tools
              mountPath: /tools
              readOnly: true
            - name: config-seed
              mountPath: /seed
              readOnly: true
            - name: entrypoint
              mountPath: /entrypoint
              readOnly: true
            # Persist apt marker across restarts within pod lifetime only (emptyDir ok);
            # full package set reinstalls if marker lost — image has no packages baked in.
            - name: sandbox-var
              mountPath: /var/lib/opencode-sandbox
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: opencode-workspace
        - name: docker-data
          persistentVolumeClaim:
            claimName: opencode-docker
        - name: docker-run
          emptyDir: {}
        - name: tools
          emptyDir: {}
        - name: sandbox-var
          emptyDir: {}
        - name: config-seed
          configMap:
            name: opencode-config
        - name: entrypoint
          configMap:
            name: opencode-entrypoint
            defaultMode: 0755
