apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qbittorrent
  namespace: torrenting
  annotations:
    checkov.io/skip1: CKV_K8S_8=qBittorrent WebUI becomes unresponsive during heavy rechecks; probes cause false 503s.
    checkov.io/skip2: CKV_K8S_9=qBittorrent WebUI becomes unresponsive during heavy rechecks; probes cause false 503s.
    checkov.io/skip3: CKV_K8S_22=Torrent client and VPN sidecar require writable config directories.
    checkov.io/skip4: CKV_K8S_25=Gluetun VPN sidecar requires NET_ADMIN for tunnel setup.
    checkov.io/skip5: CKV_K8S_35=Bootstrap and VPN credentials are required as env vars by Gluetun and seed scripts.
    checkov.io/skip6: CKV_K8S_37=Gluetun adds NET_ADMIN for WireGuard tunnel management.
    checkov.io/skip7: CKV_K8S_40=linuxserver images use PUID 1001 for NFS volume ownership.
    checkov.io/skip8: CKV_K8S_43=Images are tag-pinned; digest pinning tracked separately.
    checkov.io/skip9: CKV_K8S_23=Gluetun VPN sidecar requires root-equivalent privileges for tunnel setup.
spec:
  serviceName: qbittorrent-headless
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
      annotations:
        reloader.stakater.com/auto: "true"
        # Rate-limit at the CNI level to prevent BitTorrent traffic from
        # overwhelming the switch's management CPU with high packet rates.
        # These limits are enforced by the bandwidth CNI plugin (tc/tbf)
        # on the pod's veth interface — no app-level config needed.
        kubernetes.io/ingress-bandwidth: "100M"
        kubernetes.io/egress-bandwidth: "50M"
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1001
      # Restricted to Longhorn-capable workers via the iscsi-tools label only.
      # Do NOT pin to a specific hostname: the qbit-config Longhorn volume has
      # 2 replicas and is network-accessible, so any labeled worker can run it.
      # A hardcoded hostname here previously broke scheduling on node rename.
      nodeSelector:
        extensions.talos.dev/iscsi-tools: v0.2.0
      initContainers:
      - name: seed-config
        image: python:3.13-alpine
        imagePullPolicy: Always
        command: ["/usr/local/bin/python3", "/scripts/seed-qbit-conf.py"]
        env:
        - name: QBIT_USERNAME
          valueFrom:
            secretKeyRef:
              name: arr-bootstrap
              key: QBIT_USERNAME
        - name: QBIT_PASSWORD_PBKDF2
          valueFrom:
            secretKeyRef:
              name: arr-bootstrap
              key: QBIT_PASSWORD_PBKDF2
        volumeMounts:
        - name: qbit-config
          mountPath: /config
        - name: bootstrap-scripts
          mountPath: /scripts
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 0
          seccompProfile:
            type: Unconfined
          capabilities:
            add:
            - CHOWN
            - FOWNER
            - DAC_OVERRIDE
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
      # Native sidecar (k8s >= 1.29; cluster is v1.34.1). Pins our MAM
      # session to the current Gluetun exit IP — without this, every VPN
      # reconnect locks the MAM session and torrents stall.
      # Shares Gluetun's network namespace by virtue of living in the
      # same pod, so the outbound MAM call uses the same public IP as
      # qBittorrent's tracker traffic.
      - name: mousehole
        image: python:3.13-alpine
        imagePullPolicy: Always
        restartPolicy: Always
        command: ["/usr/local/bin/python3", "/scripts/mousehole.py"]
        env:
        - name: MAM_ID
          valueFrom:
            secretKeyRef:
              name: mam-credentials
              key: MAM_ID
        volumeMounts:
        - name: mousehole-scripts
          mountPath: /scripts
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 10001
          capabilities:
            drop: ["ALL"]
        resources:
          limits: {cpu: 100m, memory: 64Mi}
          requests: {cpu: 10m, memory: 32Mi}
      containers:
      - name: gluetun
        image: qmcgaw/gluetun:v3.40.0
        imagePullPolicy: Always
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        env:
        # VPN_SERVICE_PROVIDER=custom (rather than protonvpn) is required
        # for Gluetun to honor the VPN_ENDPOINT_IP/PORT overrides below.
        # In provider mode Gluetun picks from its bundled server list and
        # ignores the endpoint env. We're effectively BYO-WireGuard, with
        # ProtonVPN as the operator behind the peer keys.
        - name: VPN_SERVICE_PROVIDER
          value: custom
        - name: VPN_TYPE
          value: wireguard
        - name: WIREGUARD_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              key: WIREGUARD_PRIVATE_KEY
              name: protonvpn-wireguard
        - name: WIREGUARD_ADDRESSES
          valueFrom:
            secretKeyRef:
              key: WIREGUARD_ADDRESSES
              name: protonvpn-wireguard
        # Pin Gluetun to one specific ProtonVPN WG server (US-CA#841,
        # 79.127.185.162). When PUBLIC_KEY + ENDPOINT_IP + ENDPOINT_PORT
        # are all set, Gluetun bypasses provider server selection and
        # connects only to this endpoint — so the exit IP is fixed and
        # the MAM session can be IP-locked. Tradeoff: zero failover if
        # this single server goes down; pick a new server in Proton's
        # portal and rotate these three fields to recover.
        - name: WIREGUARD_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              key: WIREGUARD_PUBLIC_KEY
              name: protonvpn-wireguard
        - name: VPN_ENDPOINT_IP
          valueFrom:
            secretKeyRef:
              key: WIREGUARD_ENDPOINT_IP
              name: protonvpn-wireguard
        - name: VPN_ENDPOINT_PORT
          valueFrom:
            secretKeyRef:
              key: WIREGUARD_ENDPOINT_PORT
              name: protonvpn-wireguard
        - name: TZ
          value: America/Los_Angeles
        - name: FIREWALL_VPN_INPUT_PORTS
          value: "8080,30611,8081,30612,8082,30613"
        - name: HEALTH_VPN_DURATION_INITIAL
          value: "0s"
        - name: DOT
          value: "off"
        - name: DNS_ADDRESS
          value: "1.1.1.1"
        - name: FIREWALL_OUTBOUND_SUBNETS
          value: "10.0.0.0/8"
        ports:
        - containerPort: 8080
          name: http-0
        - containerPort: 8081
          name: http-1
        - containerPort: 8082
          name: http-2
        - containerPort: 8000
          name: control
        volumeMounts:
        # Widens the no-auth role on Gluetun's control server so mousehole
        # (in this pod's loopback) can issue PUT /v1/vpn/status to reroll
        # the tunnel when MAM rejects a partner-ASN exit.
        - name: gluetun-auth
          mountPath: /gluetun/auth/config.toml
          subPath: config.toml
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
      - name: qbittorrent
        image: linuxserver/qbittorrent:latest
        imagePullPolicy: Always
        env:
        - name: PUID
          value: "1001"
        - name: PGID
          value: "100"
        - name: TZ
          value: America/Los_Angeles
        - name: WEBUI_PORT
          value: "8080"
        - name: UMASK
          value: "002"
        volumeMounts:
        - mountPath: /config
          name: qbit-config
        - mountPath: /data
          name: torrents
        # No liveness or readiness probe. The WebUI thread becomes
        # unresponsive during heavy disk operations (full rechecks of
        # large torrents over NFS especially), and a failing readiness
        # probe yanks the pod from the Service so nginx returns 503 for
        # every UI request — including when the rest of qBit is fine.
        # Letting requests reach the container surfaces the actual state
        # (sometimes slow, occasionally hung) rather than masking it
        # behind 503s.
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: torrents
        persistentVolumeClaim:
          claimName: torrents-unified-pvc
      # qbit-config holds /config/qBittorrent: BT_backup (one file per
      # active torrent), categories.json, watched_folders.json, RSS state,
      # logs, and the seeded qBittorrent.conf. Was emptyDir originally —
      # which meant every pod restart wiped the torrent list (the .torrent
      # data on /data survives, but qBit has to be re-told which torrents
      # to seed). Backed by Longhorn now so state survives restarts, node
      # reboots, image rolls, etc. See apps/torrenting/qbittorrent/config-pvc.yaml.
      - name: qbit-config
        persistentVolumeClaim:
          claimName: qbit-config
      - name: bootstrap-scripts
        configMap:
          name: arr-bootstrap-scripts
          defaultMode: 0755
      - name: mousehole-scripts
        configMap:
          name: mousehole-script
          defaultMode: 0755
      - name: gluetun-auth
        configMap:
          name: gluetun-auth-config
