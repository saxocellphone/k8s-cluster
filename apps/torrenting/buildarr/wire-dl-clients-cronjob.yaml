apiVersion: v1
kind: ConfigMap
metadata:
  name: wire-dl-clients-script
  namespace: torrenting
data:
  wire.sh: |
    #!/bin/sh
    set -eu
    # Idempotent post-deploy wiring done outside Buildarr because Buildarr 0.7.1
    # has bugs in: (a) sonarr/radarr download client create (SecretStr), and
    # (b) prowlarr indexer create order (tries indexer before proxy).
    # We POST these via REST API and check existence first to be re-runnable.

    QBIT_HOST="qbittorrent.torrenting.svc.cluster.local"
    QBIT_PORT="8080"
    QBIT_USER="admin"
    QBIT_PASS="${QBIT_PASSWORD}"

    PROWLARR_BASE="http://prowlarr.torrenting.svc.cluster.local:9696"
    PROWLARR_KEY="${PROWLARR_API_KEY}"

    wire_arr_dlclient() {
      local name="$1" base="$2" key="$3" category="$4"
      echo "=== ${name}: download client ==="
      existing=$(curl -sS -H "X-Api-Key: $key" "$base/api/v3/downloadclient" | python3 -c "import json,sys; clients=json.load(sys.stdin); print(sum(1 for c in clients if c.get('name')=='qBittorrent'))")
      if [ "$existing" -gt 0 ]; then
        echo "qBittorrent already configured in $name"
        return 0
      fi
      cat > /tmp/payload.json <<EOF
    {
      "enable": true, "protocol": "torrent", "priority": 1,
      "removeCompletedDownloads": true, "removeFailedDownloads": true,
      "name": "qBittorrent",
      "fields": [
        {"name": "host", "value": "$QBIT_HOST"},
        {"name": "port", "value": $QBIT_PORT},
        {"name": "useSsl", "value": false},
        {"name": "urlBase", "value": ""},
        {"name": "username", "value": "$QBIT_USER"},
        {"name": "password", "value": "$QBIT_PASS"},
        {"name": "movieCategory", "value": "$category"},
        {"name": "tvCategory", "value": "$category"},
        {"name": "musicCategory", "value": "$category"},
        {"name": "recentMoviePriority", "value": 0},
        {"name": "olderMoviePriority", "value": 0},
        {"name": "recentTvPriority", "value": 0},
        {"name": "olderTvPriority", "value": 0},
        {"name": "initialState", "value": 0}
      ],
      "implementationName": "qBittorrent", "implementation": "QBittorrent",
      "configContract": "QBittorrentSettings", "tags": []
    }
    EOF
      code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
        -X POST -H "X-Api-Key: $key" -H "Content-Type: application/json" \
        --data @/tmp/payload.json "$base/api/v3/downloadclient")
      if [ "$code" = "201" ]; then
        echo "created qBittorrent in $name (HTTP $code)"
      elif [ "$code" = "400" ] && grep -q "Should be unique" /tmp/resp.json; then
        echo "qBittorrent already exists in $name (race-safe skip)"
      else
        echo "FAILED to create in $name (HTTP $code):"; cat /tmp/resp.json; return 1
      fi
    }

    ensure_prowlarr_tag() {
      local label="$1"
      existing_id=$(curl -sS -H "X-Api-Key: $PROWLARR_KEY" "$PROWLARR_BASE/api/v1/tag" \
        | python3 -c "import json,sys,os; tags=json.load(sys.stdin); print(next((t['id'] for t in tags if t['label']==os.environ['LABEL']),''))" \
        2>/dev/null) || existing_id=""
      LABEL="$label"
      existing_id=$(LABEL="$label" curl -sS -H "X-Api-Key: $PROWLARR_KEY" "$PROWLARR_BASE/api/v1/tag" \
        | python3 -c "import json,sys,os; tags=json.load(sys.stdin); print(next((t['id'] for t in tags if t['label']==os.environ['LABEL']),''))")
      if [ -n "$existing_id" ]; then
        echo "tag '$label' already exists (id=$existing_id)"
        echo "$existing_id"
        return 0
      fi
      response=$(curl -sS -X POST -H "X-Api-Key: $PROWLARR_KEY" -H "Content-Type: application/json" \
        -d "{\"label\":\"$label\"}" "$PROWLARR_BASE/api/v1/tag")
      new_id=$(echo "$response" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
      echo "created tag '$label' (id=$new_id)"
      echo "$new_id"
    }

    ensure_flaresolverr_proxy() {
      local tag_id="$1"
      echo "=== prowlarr: FlareSolverr proxy ==="
      existing=$(curl -sS -H "X-Api-Key: $PROWLARR_KEY" "$PROWLARR_BASE/api/v1/indexerproxy" | python3 -c "import json,sys; xs=json.load(sys.stdin); print(sum(1 for x in xs if x.get('name')=='FlareSolverr'))")
      if [ "$existing" -gt 0 ]; then
        echo "FlareSolverr proxy already configured"
        return 0
      fi
      cat > /tmp/proxy.json <<EOF
    {
      "name": "FlareSolverr",
      "fields": [
        {"name": "host", "value": "http://flaresolverr.torrenting.svc.cluster.local:8191/"},
        {"name": "requestTimeout", "value": 60}
      ],
      "implementationName": "FlareSolverr", "implementation": "FlareSolverr",
      "configContract": "FlareSolverrSettings",
      "tags": [$tag_id]
    }
    EOF
      code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
        -X POST -H "X-Api-Key: $PROWLARR_KEY" -H "Content-Type: application/json" \
        --data @/tmp/proxy.json "$PROWLARR_BASE/api/v1/indexerproxy")
      if [ "$code" = "201" ]; then
        echo "created FlareSolverr proxy (HTTP $code)"
      elif [ "$code" = "400" ] && grep -q -i "unique\|already" /tmp/resp.json; then
        echo "FlareSolverr proxy already exists (race-safe skip)"
      else
        echo "FAILED FlareSolverr proxy (HTTP $code):"; cat /tmp/resp.json; return 1
      fi
    }

    ensure_indexer_1337x() {
      local tag_id="$1"
      echo "=== prowlarr: 1337x indexer ==="
      existing=$(curl -sS -H "X-Api-Key: $PROWLARR_KEY" "$PROWLARR_BASE/api/v1/indexer" | python3 -c "import json,sys; xs=json.load(sys.stdin); print(sum(1 for x in xs if x.get('name')=='1337x'))")
      if [ "$existing" -gt 0 ]; then
        echo "1337x indexer already configured"
        return 0
      fi
      cat > /tmp/idx.json <<EOF
    {
      "name": "1337x", "enable": true, "redirect": false, "supportsRss": true,
      "supportsSearch": true, "supportsRedirect": false, "supportsPagination": true,
      "appProfileId": 1, "protocol": "torrent", "privacy": "public", "priority": 25,
      "downloadClientId": 0,
      "fields": [
        {"name": "definitionFile", "value": "1337x"},
        {"name": "baseUrl", "value": "https://1337x.to/"},
        {"name": "torrentBaseSettings.seedRatio"}
      ],
      "implementationName": "Cardigann", "implementation": "Cardigann",
      "configContract": "CardigannSettings",
      "tags": [$tag_id]
    }
    EOF
      code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
        -X POST -H "X-Api-Key: $PROWLARR_KEY" -H "Content-Type: application/json" \
        --data @/tmp/idx.json "$PROWLARR_BASE/api/v1/indexer")
      if [ "$code" = "201" ]; then
        echo "created 1337x indexer (HTTP $code)"
      elif [ "$code" = "400" ] && grep -q -i "unique\|already" /tmp/resp.json; then
        echo "1337x indexer already exists (race-safe skip)"
      else
        echo "FAILED 1337x indexer (HTTP $code):"; cat /tmp/resp.json; return 1
      fi
    }

    # Download clients in radarr + sonarr
    wire_arr_dlclient radarr "http://radarr.torrenting.svc.cluster.local:7878" "$RADARR_API_KEY" "radarr"
    wire_arr_dlclient sonarr "http://sonarr.torrenting.svc.cluster.local:8989" "$SONARR_API_KEY" "sonarr"

    # FlareSolverr proxy + 1337x indexer in Prowlarr
    TAG_ID=$(ensure_prowlarr_tag flaresolverr | tail -1)
    ensure_flaresolverr_proxy "$TAG_ID"
    ensure_indexer_1337x "$TAG_ID"

    echo "ALL DONE"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wire-dl-clients
  namespace: torrenting
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: wire
            image: nicolaka/netshoot:latest
            command: ["/bin/sh", "/scripts/wire.sh"]
            env:
            - name: RADARR_API_KEY
              valueFrom:
                secretKeyRef: { name: arr-bootstrap, key: RADARR_API_KEY }
            - name: SONARR_API_KEY
              valueFrom:
                secretKeyRef: { name: arr-bootstrap, key: SONARR_API_KEY }
            - name: PROWLARR_API_KEY
              valueFrom:
                secretKeyRef: { name: arr-bootstrap, key: PROWLARR_API_KEY }
            - name: QBIT_PASSWORD
              valueFrom:
                secretKeyRef: { name: arr-bootstrap, key: QBIT_PASSWORD }
            volumeMounts:
            - name: scripts
              mountPath: /scripts
            resources:
              limits: { cpu: 200m, memory: 128Mi }
              requests: { cpu: 10m, memory: 32Mi }
          volumes:
          - name: scripts
            configMap:
              name: wire-dl-clients-script
              defaultMode: 0755
