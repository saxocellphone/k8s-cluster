apiVersion: v1
kind: ConfigMap
metadata:
  name: wire-dl-clients-script
  namespace: torrenting
data:
  indexers.json: |
    [
      {"definitionName": "nyaasi",          "useFlareSolverr": false},
      {"definitionName": "1337x",           "useFlareSolverr": true},
      {"definitionName": "internetarchive", "useFlareSolverr": false},
      {"definitionName": "ebookbay",        "useFlareSolverr": true}
    ]
  wire.sh: |
    #!/bin/sh
    set -eu
    # Idempotent post-deploy wiring for the *arr stack.
    # Replaces what Buildarr was supposed to do (it was unreliable for our
    # use case). All steps check existence first and are safe to re-run.
    #
    # What this script configures:
    #   - radarr: root folder /data/movies, qBit download client
    #   - sonarr: root folder /data/tv, qBit download client
    #   - prowlarr: Sonarr/Radarr application links, FlareSolverr proxy
    #
    # Indexers are declared in indexers.json (same ConfigMap). Add new ones
    # there. CF-protected indexers should set "useFlareSolverr": true to be
    # tagged through the FlareSolverr proxy. Failed adds are logged but
    # don't stop the job — next CronJob cycle retries them.

    QBIT_HOST="qbittorrent.torrenting.svc.cluster.local"
    QBIT_PORT="8080"
    QBIT_USER="admin"
    QBIT_PASS="${QBIT_PASSWORD}"

    RADARR_BASE="http://radarr.torrenting.svc.cluster.local:7878"
    SONARR_BASE="http://sonarr.torrenting.svc.cluster.local:8989"
    PROWLARR_BASE="http://prowlarr.torrenting.svc.cluster.local:9696"

    # ---------- helpers ----------

    json_count() {
      # Count items in a JSON array where field "$1" equals "$2".
      python3 -c "import json,sys; xs=json.load(sys.stdin); print(sum(1 for x in xs if x.get('$1')=='$2'))"
    }

    post_or_skip_dup() {
      # Args: name, http_code, resp_file
      local what="$1" code="$2" resp="$3"
      if [ "$code" = "201" ]; then
        echo "  created $what (HTTP $code)"
      elif [ "$code" = "400" ] && grep -q -i "unique\|already" "$resp"; then
        echo "  $what already exists (race-safe skip)"
      else
        echo "  FAILED $what (HTTP $code):"; cat "$resp"; return 1
      fi
    }

    # ---------- download clients (radarr + sonarr) ----------

    wire_dlclient() {
      local name="$1" base="$2" key="$3" category="$4"
      echo "[$name] download client"
      existing=$(curl -sS -H "X-Api-Key: $key" "$base/api/v3/downloadclient" | json_count name qBittorrent)
      [ "$existing" -gt 0 ] && { echo "  qBittorrent already configured"; return 0; }
      cat > /tmp/payload.json <<EOF
    {"enable": true, "protocol": "torrent", "priority": 1,
     "removeCompletedDownloads": true, "removeFailedDownloads": true,
     "name": "qBittorrent",
     "fields": [
       {"name": "host", "value": "$QBIT_HOST"},
       {"name": "port", "value": $QBIT_PORT},
       {"name": "useSsl", "value": false},
       {"name": "urlBase", "value": ""},
       {"name": "username", "value": "$QBIT_USER"},
       {"name": "password", "value": "$QBIT_PASS"},
       {"name": "movieCategory", "value": "$category"},
       {"name": "tvCategory", "value": "$category"},
       {"name": "musicCategory", "value": "$category"},
       {"name": "recentMoviePriority", "value": 0},
       {"name": "olderMoviePriority", "value": 0},
       {"name": "recentTvPriority", "value": 0},
       {"name": "olderTvPriority", "value": 0},
       {"name": "initialState", "value": 0}
     ],
     "implementationName": "qBittorrent", "implementation": "QBittorrent",
     "configContract": "QBittorrentSettings", "tags": []}
    EOF
      code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' --max-time 30 \
        -X POST -H "X-Api-Key: $key" -H "Content-Type: application/json" \
        --data @/tmp/payload.json "$base/api/v3/downloadclient")
      post_or_skip_dup "qBittorrent" "$code" /tmp/resp.json
    }

    # ---------- root folders (radarr + sonarr) ----------

    wire_rootfolder() {
      local name="$1" base="$2" key="$3" path="$4"
      echo "[$name] root folder $path"
      existing=$(curl -sS -H "X-Api-Key: $key" "$base/api/v3/rootfolder" | python3 -c "import json,sys; xs=json.load(sys.stdin); print(sum(1 for x in xs if x.get('path')=='$path'))")
      [ "$existing" -gt 0 ] && { echo "  $path already configured"; return 0; }
      code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' --max-time 30 \
        -X POST -H "X-Api-Key: $key" -H "Content-Type: application/json" \
        -d "{\"path\":\"$path\"}" "$base/api/v3/rootfolder")
      post_or_skip_dup "root folder $path" "$code" /tmp/resp.json
    }

    # ---------- prowlarr: app links ----------

    wire_prowlarr_app() {
      # 5th arg `cats` is an optional JSON array of newznab category IDs
      # for syncCategories. Defaults to []. Radarr/Sonarr accept empty.
      local name="$1" impl="$2" base="$3" key="$4" cats="${5:-[]}"
      echo "[prowlarr] app link: $name"
      existing=$(curl -sS -H "X-Api-Key: $PROWLARR_API_KEY" "$PROWLARR_BASE/api/v1/applications" | json_count name "$name")
      [ "$existing" -gt 0 ] && { echo "  $name app link already configured"; return 0; }
      cat > /tmp/app.json <<EOF
    {"name": "$name", "syncLevel": "addOnly",
     "fields": [
       {"name": "prowlarrUrl", "value": "$PROWLARR_BASE"},
       {"name": "baseUrl", "value": "$base"},
       {"name": "apiKey", "value": "$key"},
       {"name": "syncCategories", "value": $cats}
     ],
     "implementationName": "$impl", "implementation": "$impl",
     "configContract": "${impl}Settings", "tags": []}
    EOF
      code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' --max-time 30 \
        -X POST -H "X-Api-Key: $PROWLARR_API_KEY" -H "Content-Type: application/json" \
        --data @/tmp/app.json "$PROWLARR_BASE/api/v1/applications")
      post_or_skip_dup "$name app link" "$code" /tmp/resp.json
    }

    # ---------- prowlarr: tag + FlareSolverr proxy ----------

    ensure_prowlarr_tag() {
      # Prints id to stdout; logs to stderr.
      local label="$1"
      existing_id=$(curl -sS -H "X-Api-Key: $PROWLARR_API_KEY" "$PROWLARR_BASE/api/v1/tag" \
        | python3 -c "import json,sys; tags=json.load(sys.stdin); print(next((t['id'] for t in tags if t['label']=='$label'),''))")
      if [ -n "$existing_id" ]; then
        echo "  tag '$label' already exists (id=$existing_id)" >&2
        echo "$existing_id"
        return 0
      fi
      response=$(curl -sS -X POST -H "X-Api-Key: $PROWLARR_API_KEY" -H "Content-Type: application/json" \
        -d "{\"label\":\"$label\"}" "$PROWLARR_BASE/api/v1/tag")
      new_id=$(echo "$response" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
      echo "  created tag '$label' (id=$new_id)" >&2
      echo "$new_id"
    }

    wire_flaresolverr_proxy() {
      local tag_id="$1"
      echo "[prowlarr] FlareSolverr proxy"
      existing=$(curl -sS -H "X-Api-Key: $PROWLARR_API_KEY" "$PROWLARR_BASE/api/v1/indexerproxy" | json_count name FlareSolverr)
      [ "$existing" -gt 0 ] && { echo "  FlareSolverr proxy already configured"; return 0; }
      cat > /tmp/proxy.json <<EOF
    {"name": "FlareSolverr",
     "fields": [
       {"name": "host", "value": "http://flaresolverr.torrenting.svc.cluster.local:8191/"},
       {"name": "requestTimeout", "value": 60}
     ],
     "implementationName": "FlareSolverr", "implementation": "FlareSolverr",
     "configContract": "FlareSolverrSettings",
     "tags": [$tag_id]}
    EOF
      code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' --max-time 30 \
        -X POST -H "X-Api-Key: $PROWLARR_API_KEY" -H "Content-Type: application/json" \
        --data @/tmp/proxy.json "$PROWLARR_BASE/api/v1/indexerproxy")
      post_or_skip_dup "FlareSolverr proxy" "$code" /tmp/resp.json
    }

    # (readarr was removed from the cluster; its download-client / metadata /
    # root-folder / prowlarr-app-link wiring used to live here. See git
    # history for the original implementation if it's ever resurrected.)

    # ---------- qbittorrent: save paths via Web API ----------

    wire_qbit_paths() {
      echo "[qbittorrent] save paths"
      QBIT_BASE="http://qbittorrent.torrenting.svc.cluster.local:8080"
      # Login -> session cookie. Newer qBit returns HTTP 200/204 with empty
      # body on success and 403 on failure (legacy versions returned 'Ok.'
      # text). Check the status code, not the body.
      login_code=$(curl -sS -o /dev/null -w '%{http_code}' \
        -c /tmp/qbit-cookies.txt -X POST \
        -H "Referer: $QBIT_BASE" \
        --data-urlencode "username=$QBIT_USER" \
        --data-urlencode "password=$QBIT_PASS" \
        "$QBIT_BASE/api/v2/auth/login")
      case "$login_code" in
        200|204) : ;;
        *) echo "  ERROR: qbit login failed (HTTP $login_code)"; return 1 ;;
      esac
      # Read current settings so we can no-op when correct. We also manage
      # bypass_auth_subnet_whitelist here (originally a workaround for a
      # qBit-5.x compat bug in Readarr's QBittorrentProxyV2; harmless to
      # keep enabled now that readarr is gone, removes a future surprise
      # if anything else wants unauthenticated qBit access from the cluster).
      cur=$(curl -sS -b /tmp/qbit-cookies.txt "$QBIT_BASE/api/v2/app/preferences" \
        | python3 -c "import json,sys; p=json.load(sys.stdin); print(p.get('save_path',''),p.get('temp_path',''),p.get('temp_path_enabled',False),p.get('bypass_auth_subnet_whitelist_enabled',False),p.get('bypass_auth_subnet_whitelist',''))")
      want="/data/qbit/ /data/qbit/incomplete True True 10.244.0.0/16"
      if [ "$cur" = "$want" ]; then
        echo "  save_path + bypass_auth_subnet already configured"; return 0
      fi
      # Set save_path + temp_path + auth bypass for cluster pod CIDR.
      # qBit expects 'json=<urlencoded-json>' form body.
      code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' -b /tmp/qbit-cookies.txt \
        -X POST --data-urlencode 'json={"save_path":"/data/qbit","temp_path":"/data/qbit/incomplete","temp_path_enabled":true,"bypass_auth_subnet_whitelist_enabled":true,"bypass_auth_subnet_whitelist":"10.244.0.0/16"}' \
        "$QBIT_BASE/api/v2/app/setPreferences")
      if [ "$code" = "200" ]; then
        echo "  set save_path=/data/qbit, temp_path=/data/qbit/incomplete, bypass=10.244.0.0/16"
      else
        echo "  FAILED setPreferences (HTTP $code):"; cat /tmp/resp.txt; return 1
      fi
    }

    # ---------- run ----------

    wire_qbit_paths
    # All `|| echo "skipped"` falls cover the case where one of the *arr
    # services is temporarily unreachable (newly bootstrapped, scaled to 0,
    # restarting); the next cron cycle re-attempts.
    wire_dlclient   radarr "$RADARR_BASE" "$RADARR_API_KEY" radarr      || echo "[radarr] skipped (unreachable)"
    wire_dlclient   sonarr "$SONARR_BASE" "$SONARR_API_KEY" sonarr
    wire_rootfolder radarr "$RADARR_BASE" "$RADARR_API_KEY" /data/movies || echo "[radarr] skipped (unreachable)"
    wire_rootfolder sonarr "$SONARR_BASE" "$SONARR_API_KEY" /data/tv

    wire_prowlarr_app Radarr Radarr "$RADARR_BASE" "$RADARR_API_KEY"    || echo "[radarr] skipped (unreachable)"
    wire_prowlarr_app Sonarr Sonarr "$SONARR_BASE" "$SONARR_API_KEY"

    TAG_ID=$(ensure_prowlarr_tag flaresolverr)
    wire_flaresolverr_proxy "$TAG_ID"

    # ---------- prowlarr: indexers from indexers.json ----------

    failed_indexers=0
    python3 -c "
    import json
    items = json.load(open('/scripts/indexers.json'))
    for i in items:
        print(f\"{i['definitionName']}|{1 if i.get('useFlareSolverr') else 0}\")
    " | while IFS='|' read def_name use_flare; do
      [ -z "$def_name" ] && continue
      echo "[prowlarr] indexer: $def_name (flaresolverr=$use_flare)"
      # Resolve the user-facing name (e.g. nyaasi -> 'Nyaa.si').
      indexer_name=$(curl -sS -H "X-Api-Key: $PROWLARR_API_KEY" "$PROWLARR_BASE/api/v1/indexer/schema" \
        | python3 -c "import json,sys; ms=[s for s in json.load(sys.stdin) if s.get('definitionName')=='$def_name']; print(ms[0]['name'] if ms else '')")
      if [ -z "$indexer_name" ]; then
        echo "  ERROR: definitionName '$def_name' not in Prowlarr schema list"
        failed_indexers=$((failed_indexers+1)); continue
      fi
      existing=$(curl -sS -H "X-Api-Key: $PROWLARR_API_KEY" "$PROWLARR_BASE/api/v1/indexer" | json_count name "$indexer_name")
      if [ "$existing" -gt 0 ]; then
        echo "  $indexer_name already configured"; continue
      fi
      tags="[]"; tmo=30
      if [ "$use_flare" = "1" ]; then tags="[$TAG_ID]"; tmo=180; fi
      # Two-step add: POST disabled, then PUT enabled with forceSave=true.
      # Why: Prowlarr's POST runs a synchronous "test connection" that
      # hangs indefinitely for some indexers (Internet Archive, EBookBay)
      # even when the underlying site responds in <300ms. A timeout
      # there crashes the entire wire job under set -e. POSTing with
      # enable=False skips the test (Prowlarr only tests enabled
      # indexers); PUT with forceSave=true bypasses the re-test.
      curl -sS -H "X-Api-Key: $PROWLARR_API_KEY" "$PROWLARR_BASE/api/v1/indexer/schema" \
        | python3 -c "
    import json,sys
    m = next(s for s in json.load(sys.stdin) if s.get('definitionName')=='$def_name')
    m.update(enable=False, appProfileId=1, priority=25, tags=$tags)
    print(json.dumps(m))
    " > /tmp/idx.json
      # `|| echo 000` swallows curl timeouts so set -e doesn't kill the whole loop.
      code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' --max-time $tmo \
        -X POST -H "X-Api-Key: $PROWLARR_API_KEY" -H "Content-Type: application/json" \
        --data @/tmp/idx.json "$PROWLARR_BASE/api/v1/indexer" || echo 000)
      if [ "$code" = "201" ]; then
        # Now enable it.
        id=$(python3 -c "import json; print(json.load(open('/tmp/resp.json'))['id'])")
        python3 -c "import json; m=json.load(open('/tmp/resp.json')); m['enable']=True; json.dump(m,open('/tmp/idx2.json','w'))"
        code2=$(curl -sS -o /tmp/resp2.json -w '%{http_code}' --max-time $tmo \
          -X PUT -H "X-Api-Key: $PROWLARR_API_KEY" -H "Content-Type: application/json" \
          --data @/tmp/idx2.json "$PROWLARR_BASE/api/v1/indexer/$id?forceSave=true" || echo 000)
        if [ "$code2" = "200" ] || [ "$code2" = "202" ]; then
          echo "  created $indexer_name (POST $code, PUT enable $code2)"
        else
          echo "  WARNING: created $indexer_name (id=$id) but failed to enable (HTTP $code2). Enable manually in Prowlarr UI."
          head -c 200 /tmp/resp2.json; echo
        fi
      elif [ "$code" = "400" ] && grep -q -i "unique\|already" /tmp/resp.json; then
        echo "  $indexer_name already exists (race-safe skip)"
      elif [ "$code" = "000" ]; then
        echo "  FAILED $indexer_name (POST timed out/connection failed) — will retry next cycle"
      else
        echo "  FAILED $indexer_name (HTTP $code) — will retry next cycle:"
        head -c 300 /tmp/resp.json; echo
      fi
    done

    echo "ALL DONE"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wire-dl-clients
  namespace: torrenting
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  # Keep only the most-recent failed Job. Otherwise an outage that takes the
  # *arr stack down accumulates up to 3 failed Jobs (1.5h at the */30
  # schedule), and Argo flags `torrenting` as Degraded long after the actual
  # services recover — successful runs do not auto-clean failed siblings.
  # With limit=1, a single subsequent failure rolls the prior failure out and
  # Argo flips back to Healthy as soon as one success follows.
  failedJobsHistoryLimit: 1
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: wire
            image: nicolaka/netshoot:latest
            command: ["/bin/sh", "/scripts/wire.sh"]
            env:
            - name: RADARR_API_KEY
              valueFrom:
                secretKeyRef: { name: arr-bootstrap, key: RADARR_API_KEY }
            - name: SONARR_API_KEY
              valueFrom:
                secretKeyRef: { name: arr-bootstrap, key: SONARR_API_KEY }
            - name: PROWLARR_API_KEY
              valueFrom:
                secretKeyRef: { name: arr-bootstrap, key: PROWLARR_API_KEY }
            - name: QBIT_PASSWORD
              valueFrom:
                secretKeyRef: { name: arr-bootstrap, key: QBIT_PASSWORD }
            volumeMounts:
            - name: scripts
              mountPath: /scripts
            resources:
              limits: { cpu: 500m, memory: 256Mi }
              requests: { cpu: 50m, memory: 64Mi }
          volumes:
          - name: scripts
            configMap:
              name: wire-dl-clients-script
              defaultMode: 0755
