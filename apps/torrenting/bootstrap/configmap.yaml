apiVersion: v1
kind: ConfigMap
metadata:
  name: arr-bootstrap-scripts
  namespace: torrenting
data:
  seed-arr-config.sh: |
    #!/bin/sh
    set -eu
    mkdir -p /config
    cat > /config/config.xml <<EOF
    <Config>
      <BindAddress>*</BindAddress>
      <Port>${PORT}</Port>
      <SslPort>${SSL_PORT}</SslPort>
      <EnableSsl>False</EnableSsl>
      <ApiKey>${API_KEY}</ApiKey>
      <AuthenticationMethod>Forms</AuthenticationMethod>
      <AuthenticationRequired>DisabledForLocalAddresses</AuthenticationRequired>
      <Branch>master</Branch>
      <LogLevel>info</LogLevel>
      <SslCertPath></SslCertPath>
      <SslCertPassword></SslCertPassword>
      <UrlBase></UrlBase>
      <InstanceName>${INSTANCE_NAME}</InstanceName>
      <PostgresUser>arr_user</PostgresUser>
      <PostgresPassword>${POSTGRES_PASSWORD}</PostgresPassword>
      <PostgresHost>platform-postgres-rw.database.svc.cluster.local</PostgresHost>
      <PostgresPort>5432</PostgresPort>
      <PostgresMainDb>${POSTGRES_MAIN_DB}</PostgresMainDb>
      <PostgresLogDb>${POSTGRES_LOG_DB}</PostgresLogDb>
    </Config>
    EOF
  seed-qbit-conf.py: |
    #!/usr/bin/env python3
    # Seeds /config/qBittorrent/qBittorrent.conf on every pod boot. Re-applies
    # both the WebUI credentials and a set of switch-friendly defaults so they
    # survive UI changes, a fresh /config PVC, or a qBit upgrade resetting
    # things. Idempotent: existing values are overwritten, missing keys are
    # appended, all other content is left alone.
    import os, re, pathlib

    conf = pathlib.Path('/config/qBittorrent/qBittorrent.conf')
    conf.parent.mkdir(parents=True, exist_ok=True)
    text = conf.read_text() if conf.exists() else ''

    pbkdf2 = os.environ['QBIT_PASSWORD_PBKDF2']
    settings = [
        # WebUI auth — required for qBit to come up with our password.
        ('Preferences', r'WebUI\Username', os.environ['QBIT_USERNAME']),
        ('Preferences', r'WebUI\Password_PBKDF2', f'"{pbkdf2}"'),
        # DHT / PEX / LSD: useless for private trackers (IPT, MAM) and a
        # potential ban risk. LSD does LAN multicast that trips the switch's
        # storm control; DHT chatters at high pps to public peers nonstop.
        ('BitTorrent', r'Session\DHTEnabled', 'false'),
        ('BitTorrent', r'Session\PeXEnabled', 'false'),
        ('BitTorrent', r'Session\LSDEnabled', 'false'),
        # Cap concurrent peer connections — primary driver of switch FDB
        # pressure and per-port pps load.
        ('BitTorrent', r'Session\MaxConnections', '100'),
        ('BitTorrent', r'Session\MaxConnectionsPerTorrent', '30'),
        ('BitTorrent', r'Session\MaxUploads', '8'),
        # KiB/s — matches the pod's bandwidth CNI annotations (50M egress /
        # 100M ingress) so qBit shapes internally instead of overflowing the
        # CNI bucket in bursts.
        ('BitTorrent', r'Session\GlobalDLSpeedLimit', '11719'),
        ('BitTorrent', r'Session\GlobalUPSpeedLimit', '5860'),
        # UPnP/NAT-PMP can't traverse the VPN; just LAN multicast noise.
        ('Network', 'PortForwardingEnabled', 'false'),
    ]

    def set_kv(text, section, key, value):
        section_re = re.compile(rf'^\[{re.escape(section)}\]\s*$', re.M)
        if not section_re.search(text):
            if text and not text.endswith('\n'):
                text += '\n'
            text += f'\n[{section}]\n'
        m = section_re.search(text)
        start = m.end()
        nxt = re.search(r'^\[', text[start:], re.M)
        end = start + nxt.start() if nxt else len(text)
        body = text[start:end]
        key_re = re.compile(rf'^{re.escape(key)}=.*$', re.M)
        if key_re.search(body):
            # Lambda replacement bypasses re.sub's backslash interpretation —
            # qBit config keys like `WebUI\Username` contain backslashes that
            # would otherwise be parsed as escape sequences (\U, \P, \D, ...).
            body = key_re.sub(lambda _: f'{key}={value}', body)
        else:
            if body and not body.endswith('\n'):
                body += '\n'
            body += f'{key}={value}\n'
        return text[:start] + body + text[end:]

    for section, key, value in settings:
        text = set_kv(text, section, key, value)

    conf.write_text(text)
