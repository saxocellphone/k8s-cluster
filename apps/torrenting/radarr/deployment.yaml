apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: torrenting
  annotations:
    checkov.io/skip1: CKV_K8S_22=linuxserver images require writable /config.
    checkov.io/skip2: CKV_K8S_35=ARR bootstrap init container requires API keys and DB passwords as env vars.
    checkov.io/skip3: CKV_K8S_40=linuxserver images use PUID 1001 for NFS volume ownership.
    checkov.io/skip4: CKV_K8S_43=Images are tag-pinned; digest pinning tracked separately.
spec:
  replicas: 1
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      nodeSelector:
        extensions.talos.dev/iscsi-tools: v0.2.0
      initContainers:
        - name: seed-config
          image: busybox:1.36
          command: ["/bin/sh", "/scripts/seed-arr-config.sh"]
          env:
            - name: PORT
              value: "7878"
            - name: SSL_PORT
              value: "9898"
            - name: INSTANCE_NAME
              value: "Radarr"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: arr-bootstrap
                  key: RADARR_API_KEY
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-postgres-credentials
                  key: arr-user-password
            - name: POSTGRES_MAIN_DB
              value: radarr_main
            - name: POSTGRES_LOG_DB
              value: radarr_log
          volumeMounts:
            - name: radarr-config
              mountPath: /config
            - name: bootstrap-scripts
              mountPath: /scripts
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      containers:
        - name: radarr
          image: linuxserver/radarr:5.22.4
          env:
            - name: PUID
              value: "1001"
            - name: PGID
              value: "100"
            - name: TZ
              value: America/Los_Angeles
            - name: UMASK
              value: "002"
          ports:
            - containerPort: 7878
              name: http
          volumeMounts:
            - mountPath: /config
              name: radarr-config
            - mountPath: /data
              name: torrents
          livenessProbe:
            httpGet:
              path: /ping
              port: 7878
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /ping
              port: 7878
            initialDelaySeconds: 120
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
      volumes:
        - name: radarr-config
          emptyDir: {}
        - name: torrents
          persistentVolumeClaim:
            claimName: torrents-unified-pvc
        - name: bootstrap-scripts
          configMap:
            name: arr-bootstrap-scripts
            defaultMode: 0755
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
