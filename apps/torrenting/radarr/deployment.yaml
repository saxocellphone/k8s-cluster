apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: torrenting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      nodeSelector:
        extensions.talos.dev/iscsi-tools: v0.2.0
      initContainers:
      - name: seed-config
        image: busybox:1.36
        command: ["/bin/sh", "/scripts/seed-arr-config.sh"]
        env:
        - name: PORT
          value: "7878"
        - name: SSL_PORT
          value: "9898"
        - name: INSTANCE_NAME
          value: "Radarr"
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: arr-bootstrap
              key: RADARR_API_KEY
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-arr-credentials
              key: arr-user-password
        - name: POSTGRES_MAIN_DB
          value: radarr_main
        - name: POSTGRES_LOG_DB
          value: radarr_log
        volumeMounts:
        - name: radarr-config
          mountPath: /config
        - name: bootstrap-scripts
          mountPath: /scripts
      containers:
      - name: radarr
        image: linuxserver/radarr:latest
        env:
        - name: PUID
          value: "1001"
        - name: PGID
          value: "100"
        - name: TZ
          value: America/Los_Angeles
        - name: UMASK
          value: "002"
        ports:
        - containerPort: 7878
          name: http
        volumeMounts:
        - mountPath: /config
          name: radarr-config
        - mountPath: /data
          name: torrents
        livenessProbe:
          httpGet:
            path: /ping
            port: 7878
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 10
        readinessProbe:
          httpGet:
            path: /ping
            port: 7878
          initialDelaySeconds: 120
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 10
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
      volumes:
      - name: radarr-config
        persistentVolumeClaim:
          claimName: radarr-config-pvc
      - name: torrents
        persistentVolumeClaim:
          claimName: torrents-unified-pvc
      - name: bootstrap-scripts
        configMap:
          name: arr-bootstrap-scripts
          defaultMode: 0755
