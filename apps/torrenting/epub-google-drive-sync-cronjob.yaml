apiVersion: batch/v1
kind: CronJob
metadata:
  name: epub-google-drive-sync
  namespace: torrenting
  annotations:
    checkov.io/skip1: CKV_K8S_14=rclone image is tag-pinned.
    checkov.io/skip2: CKV_K8S_22=CronJob writes a temporary rclone config file.
    checkov.io/skip3: CKV_K8S_35=Google Drive token is mounted via secret-backed env indirection.
    checkov.io/skip4: CKV_K8S_40=rclone image runs as a low UID.
    checkov.io/skip5: CKV_K8S_43=Image is tag-pinned; digest pinning tracked separately.
spec:
  schedule: "0 * * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  startingDeadlineSeconds: 900
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: rclone
              image: rclone/rclone:1.69.0
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  mkdir -p /tmp/rclone
                  cp /config-template/rclone.conf /tmp/rclone/rclone.conf
                  chmod 600 /tmp/rclone/rclone.conf

                  rclone copy "$SOURCE" "$EPUB_DESTINATION" \
                    --config /tmp/rclone/rclone.conf \
                    --filter "+ *.epub" \
                    --filter "+ *.EPUB" \
                    --filter "- *" \
                    --create-empty-src-dirs \
                    --fast-list \
                    --transfers 4 \
                    --checkers 8 \
                    --drive-chunk-size 64M \
                    --log-level INFO \
                    --stats 1m

                  rclone copy "$SOURCE" "$CBZ_DESTINATION" \
                    --config /tmp/rclone/rclone.conf \
                    --filter "+ *.cbz" \
                    --filter "+ *.CBZ" \
                    --filter "- *" \
                    --fast-list \
                    --transfers 4 \
                    --checkers 8 \
                    --drive-chunk-size 64M \
                    --log-level INFO \
                    --stats 1m
              env:
                - name: SOURCE
                  value: /books
                - name: EPUB_DESTINATION
                  value: gdrive:Rakuten Kobo/epubs
                - name: CBZ_DESTINATION
                  value: gdrive:Rakuten Kobo/cbz
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 50m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1001
                capabilities:
                  drop:
                    - ALL
                runAsGroup: 100
              volumeMounts:
                - name: books
                  mountPath: /books
                  subPath: books/ebooks
                  readOnly: true
                - name: rclone-config
                  mountPath: /config-template
                  readOnly: true
              imagePullPolicy: Always
          volumes:
            - name: books
              persistentVolumeClaim:
                claimName: torrents-unified-pvc
            - name: rclone-config
              secret:
                secretName: google-drive-rclone
                defaultMode: 0444
                items:
                  - key: rclone.conf
                    path: rclone.conf
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
        metadata: {}
