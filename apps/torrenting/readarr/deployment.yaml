apiVersion: apps/v1
kind: Deployment
metadata:
  name: readarr
  namespace: torrenting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: readarr
  template:
    metadata:
      labels:
        app: readarr
    spec:
      nodeSelector:
        extensions.talos.dev/iscsi-tools: v0.2.0
      initContainers:
      - name: seed-config
        image: busybox:1.36
        command: ["/bin/sh", "/scripts/seed-arr-config.sh"]
        env:
        - name: PORT
          value: "8787"
        - name: SSL_PORT
          value: "9898"
        - name: INSTANCE_NAME
          value: "Readarr"
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: arr-bootstrap
              key: READARR_API_KEY
        volumeMounts:
        - name: readarr-config
          mountPath: /config
        - name: bootstrap-scripts
          mountPath: /scripts
      containers:
      - name: readarr
        # Readarr has never had a stable release; LinuxServer ships
        # `develop` and `nightly` channels. Pin to a versioned nightly:
        #
        #   1. The rolling `develop` / `amd64-develop` / `nightly` tags
        #      ship empty multi-arch manifests on Docker Hub
        #      (`"manifests": []`) so kubelet rejects them with "no
        #      match for platform". Versioned tags have proper amd64/
        #      arm64 entries.
        #   2. `0.4.18-develop` is too old for qBittorrent 5.x: its
        #      QBittorrentProxyV2.AuthenticateClient throws
        #      "Failed to authenticate with qBittorrent" because qBit
        #      5.x returns 204+empty body instead of "Ok." text. The
        #      fix is in the nightly channel.
        #
        # Bump this manually as LSIO publishes new releases:
        # https://hub.docker.com/r/linuxserver/readarr/tags
        image: linuxserver/readarr:0.4.19-nightly
        env:
        - name: PUID
          value: "1001"
        - name: PGID
          value: "100"
        - name: TZ
          value: America/Los_Angeles
        - name: UMASK
          value: "002"
        ports:
        - containerPort: 8787
          name: http
        volumeMounts:
        - mountPath: /config
          name: readarr-config
        - mountPath: /data
          name: torrents
        livenessProbe:
          httpGet:
            path: /ping
            port: 8787
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 10
        readinessProbe:
          httpGet:
            path: /ping
            port: 8787
          initialDelaySeconds: 120
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 10
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
      volumes:
      - name: readarr-config
        persistentVolumeClaim:
          claimName: readarr-config-pvc
      - name: torrents
        persistentVolumeClaim:
          claimName: torrents-unified-pvc
      - name: bootstrap-scripts
        configMap:
          name: arr-bootstrap-scripts
          defaultMode: 0755
