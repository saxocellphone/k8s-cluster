apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghostfolio
  namespace: ghostfolio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ghostfolio
  template:
    metadata:
      labels:
        app: ghostfolio
    spec:
      nodeSelector:
        extensions.talos.dev/iscsi-tools: "v0.2.0"
      containers:
      - name: ghostfolio
        image: ghostfolio/ghostfolio:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3333
          name: http
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ghostfolio-secrets
              key: postgres-password
        - name: DATABASE_URL
          value: postgresql://ghostfolio:$(POSTGRES_PASSWORD)@postgres:5432/ghostfolio?sslmode=prefer
        - name: REDIS_HOST
          value: redis
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ghostfolio-secrets
              key: redis-password
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ghostfolio-secrets
              key: jwt-secret-key
        - name: ACCESS_TOKEN_SALT
          valueFrom:
            secretKeyRef:
              name: ghostfolio-secrets
              key: access-token-salt
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 3333
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 3333
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "2"
            memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ghostfolio
  namespace: ghostfolio
spec:
  selector:
    app: ghostfolio
  ports:
  - name: http
    port: 3333
    targetPort: 3333
