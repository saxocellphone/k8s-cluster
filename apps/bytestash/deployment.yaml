apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bytestash-data
  namespace: bytestash
spec:
  # SQLite database + snippet blobs live here. NFS would be a bad fit for
  # SQLite (locking + latency); use Longhorn so writes stay local-block.
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bytestash
  namespace: bytestash
  labels:
    app: bytestash
spec:
  replicas: 1
  # PVC is RWO + Longhorn -- never run two pods at once against the same DB.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bytestash
  template:
    metadata:
      labels:
        app: bytestash
    spec:
      # Longhorn volumes only attach on nodes carrying the iscsi-tools
      # extension (see infrastructure/longhorn + talos/ patches).
      nodeSelector:
        extensions.talos.dev/iscsi-tools: "v0.2.0"
      containers:
      - name: bytestash
        image: ghcr.io/jordan-dalby/bytestash:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5000
          protocol: TCP
        env:
        - name: BASE_PATH
          value: ""
        - name: TOKEN_EXPIRY
          value: "7d"
        - name: ALLOW_NEW_ACCOUNTS
          value: "true"
        - name: ALLOW_PASSWORD_CHANGES
          value: "true"
        - name: DISABLE_ACCOUNTS
          value: "false"
        - name: DISABLE_INTERNAL_ACCOUNTS
          value: "false"
        - name: DEBUG
          value: "false"
        # ALLOWED_HOSTS intentionally unset: app is reachable via the LAN
        # ingress (bytestash.k8s.home) AND the Cloudflare Tunnel public
        # hostname. Set this to a comma-separated allowlist once the public
        # hostname is finalized in CF Zero Trust.
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: bytestash-secrets
              key: JWT_SECRET
        - name: TZ
          value: "America/Los_Angeles"
        volumeMounts:
        - name: data
          mountPath: /data/snippets
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: bytestash-data
