apiVersion: apps/v1
kind: Deployment
metadata:
  name: mirotalkc2c
  namespace: mirotalkc2c
  labels:
    app: mirotalkc2c
  annotations:
    checkov.io/skip1: CKV_K8S_35=WebRTC credentials are required as env vars.
    checkov.io/skip2: CKV_K8S_40=mirotalk image runs as a low UID.
    checkov.io/skip3: CKV_K8S_43=Image is tag-pinned; digest pinning tracked separately.
    checkov.io/skip4: CKV_K8S_22=WebRTC server requires writable temp and cert directories.
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mirotalkc2c
  template:
    metadata:
      labels:
        app: mirotalkc2c
      annotations:
        # Restart pods when the .env Secret changes (Argo CD won't roll us
        # automatically because the env is mounted as a file, not envFrom).
        checksum/env: replace-on-change
    spec:
      containers:
        - name: mirotalkc2c
          image: mirotalk/c2c:1.0.16
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
        # The upstream image reads /src/.env via dotenv on startup. We mount
        # the SOPS-managed Secret as a single file at that exact path.
          volumeMounts:
            - name: env
              mountPath: /src/.env
              subPath: .env
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
      volumes:
        - name: env
          secret:
            secretName: mirotalkc2c-env
            defaultMode: 0400
            items:
              - key: .env
                path: .env
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
