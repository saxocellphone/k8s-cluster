apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rotki-data
  namespace: rotki
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rotki
  namespace: rotki
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rotki
  template:
    metadata:
      labels:
        app: rotki
    spec:
      nodeSelector:
        extensions.talos.dev/iscsi-tools: "v0.2.0"
      initContainers:
      - name: init-dirs
        image: busybox:latest
        command: ["sh", "-c"]
        args:
        - mkdir -p /data /logs /config && echo "Ensured data directories exist"
        volumeMounts:
        - name: rotki-data
          mountPath: /data
          subPath: data
        - name: rotki-data
          mountPath: /logs
          subPath: logs
        - name: rotki-data
          mountPath: /config
          subPath: config
      containers:
      - name: rotki
        image: rotki/rotki:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        env:
        - name: TZ
          value: "America/Los_Angeles"
        - name: LOGLEVEL
          value: "info"
        - name: MAX_LOGFILES_NUM
          value: "5"
        - name: MAX_SIZE_IN_MB_ALL_LOGS
          value: "100"
        livenessProbe:
          httpGet:
            path: /api/1/ping
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /api/1/ping
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "2"
            memory: 2Gi
        volumeMounts:
        - name: rotki-data
          mountPath: /data
          subPath: data
        - name: rotki-data
          mountPath: /logs
          subPath: logs
        - name: rotki-data
          mountPath: /config
          subPath: config
      volumes:
      - name: rotki-data
        persistentVolumeClaim:
          claimName: rotki-data
