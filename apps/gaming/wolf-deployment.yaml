apiVersion: apps/v1
kind: Deployment
metadata:
  name: wolf
  namespace: gaming
  labels:
    app: wolf
  annotations:
    checkov.io/skip1: CKV_K8S_16=Wolf and nested Docker require privileged GPU/input device access.
    checkov.io/skip2: CKV_K8S_20=Privileged containers cannot disable privilege escalation meaningfully.
    checkov.io/skip3: CKV_K8S_22=Nested Docker and Wolf state directories require writable filesystems.
    checkov.io/skip4: CKV_K8S_23=Privileged GPU gaming stack requires root-equivalent container access.
    checkov.io/skip5: CKV_K8S_26=Moonlight/GameStream requires hostPorts for LAN discovery.
    checkov.io/skip6: CKV_K8S_28=NET_RAW is inherited by privileged nested Docker workloads.
    checkov.io/skip7: CKV_K8S_29=Pod security context is incompatible with privileged device injection.
    checkov.io/skip8: CKV_K8S_30=Container security context is incompatible with privileged GPU access.
    checkov.io/skip9: CKV_K8S_31=Seccomp profile cannot be enforced on privileged nested Docker.
    checkov.io/skip10: CKV_K8S_37=GPU/input device access requires elevated capabilities.
    checkov.io/skip11: CKV_K8S_38=Default service account token is not mounted.
    checkov.io/skip12: CKV_K8S_40=Privileged containers run as root by design.
    checkov.io/skip13: CKV_K8S_43=Wolf image is tag-pinned; digest pinning tracked separately.
    checkov.io/skip14: CKV_K8S_8=dind sidecar has no HTTP health endpoint; wolf container has tcpSocket probes.
    checkov.io/skip15: CKV_K8S_9=dind sidecar has no HTTP readiness endpoint; wolf container has tcpSocket probes.
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wolf
  template:
    metadata:
      labels:
        app: wolf
    spec:
      # Moonlight/GameStream needs direct LAN ports, but nested Docker should not
      # mutate the node network namespace. Use hostPorts instead of hostNetwork.
      nodeSelector:
        accelerator: amd-strix-halo
      tolerations:
        - key: accelerator
          operator: Equal
          value: amd-strix-halo
          effect: NoSchedule
      terminationGracePeriodSeconds: 60
      # Wolf's supervisord (program:wolf) logs to /dev/fd/1. The pod bind-mounts
      # the host /dev over the container's /dev, which shadows the image's
      # standard /dev/fd -> /proc/self/fd symlink, so supervisord aborts with
      # "The directory named as part of the path /dev/fd/1 does not exist".
      # Recreate the canonical fd symlinks on the shared /dev before Wolf starts.
      # /proc/self/fd resolves per-accessing-process, so it is correct for the
      # wolf process too; the links live on devtmpfs and vanish on node reboot.
      initContainers:
        - name: dev-fd-symlinks
          image: busybox:1.38
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              set -e
              ln -sfn /proc/self/fd /dev/fd
              ln -sfn /proc/self/fd/0 /dev/stdin
              ln -sfn /proc/self/fd/1 /dev/stdout
              ln -sfn /proc/self/fd/2 /dev/stderr
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 16Mi
          volumeMounts:
            - name: dev
              mountPath: /dev
      containers:
        - name: dind
          image: docker:29-dind
          imagePullPolicy: Always
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          command: ["dockerd"]
          args:
            - --host=unix:///var/run/docker.sock
            - --data-root=/var/lib/docker
            - --exec-root=/var/run/docker/execroot
            - --pidfile=/var/run/docker.pid
            # Match flannel/pod MTU; Docker's 1500 default causes PMTU issues
            # for nested Steam containers on the pod network.
            - --mtu=1450
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 8Gi
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run
            - name: wolf-docker
              mountPath: /var/lib/docker
            - name: wolf-state
              mountPath: /etc/wolf
            - name: wolf-runtime
              mountPath: /run/user/wolf
            - name: dev-dri
              mountPath: /dev/dri
            - name: dev-kfd
              mountPath: /dev/kfd
            - name: dev-uinput
              mountPath: /dev/uinput
            - name: dev-uhid
              mountPath: /dev/uhid
            - name: dev-input
              mountPath: /dev/input
            - name: run-udev
              mountPath: /run/udev
            - name: dev
              mountPath: /dev
        - name: wolf
          image: ghcr.io/games-on-whales/wolf:stable
          imagePullPolicy: Always
          securityContext:
            privileged: true
          env:
            - name: WOLF_DOCKER_SOCKET
              value: /var/run/docker.sock
            - name: HOST_APPS_STATE_FOLDER
              value: /etc/wolf
            - name: XDG_RUNTIME_DIR
              value: /run/user/wolf
            - name: WOLF_RENDER_NODE
              value: /dev/dri/renderD128
            - name: WOLF_ENCODER_NODE
              value: /dev/dri/renderD128
            # Wolf advertises AV1 to Moonlight only after GStreamer finds a
            # non-software encoder. Prefer AMD's Mesa VAAPI path on Strix Halo.
            - name: LIBVA_DRIVER_NAME
              value: radeonsi
            - name: GST_VAAPI_ALL_DRIVERS
              value: "1"
            - name: WOLF_LOG_LEVEL
              value: DEBUG
            - name: GST_DEBUG
              value: "2"
            - name: WOLF_STOP_CONTAINER_ON_EXIT
              value: "TRUE"
            - name: WOLF_USE_ZERO_COPY
              value: "FALSE"
            - name: WOLF_DEFAULT_RUN_UID
              value: "1000"
            - name: WOLF_DEFAULT_RUN_GID
              value: "1000"
          ports:
            - name: https
              containerPort: 47984
              hostPort: 47984
              protocol: TCP
            - name: http
              containerPort: 47989
              hostPort: 47989
              protocol: TCP
            - name: control
              containerPort: 47999
              hostPort: 47999
              protocol: UDP
            - name: rtsp
              containerPort: 48010
              hostPort: 48010
              protocol: TCP
            - name: video
              containerPort: 48100
              hostPort: 48100
              protocol: UDP
            - name: audio
              containerPort: 48200
              hostPort: 48200
              protocol: UDP
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              amd.com/gpu: 1
            limits:
              memory: 24Gi
              amd.com/gpu: 1
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: wolf-state
              mountPath: /etc/wolf
            - name: wolf-runtime
              mountPath: /run/user/wolf
            - name: docker-socket
              mountPath: /var/run
            - name: dev-dri
              mountPath: /dev/dri
            - name: dev-kfd
              mountPath: /dev/kfd
            - name: dev-uinput
              mountPath: /dev/uinput
            - name: dev-uhid
              mountPath: /dev/uhid
            - name: dev-input
              mountPath: /dev/input
            - name: run-udev
              mountPath: /run/udev
            - name: dev
              mountPath: /dev
      volumes:
        - name: wolf-state
          persistentVolumeClaim:
            claimName: wolf-state
        - name: wolf-docker
          persistentVolumeClaim:
            claimName: wolf-docker
        - name: docker-socket
          emptyDir: {}
        - name: wolf-runtime
          emptyDir: {}
        - name: dev-dri
          hostPath:
            path: /dev/dri
            type: Directory
        - name: dev-kfd
          hostPath:
            path: /dev/kfd
            type: CharDevice
        - name: dev-uinput
          hostPath:
            path: /dev/uinput
            type: CharDevice
        - name: dev-uhid
          hostPath:
            path: /dev/uhid
            type: CharDevice
        - name: dev-input
          hostPath:
            path: /dev/input
            type: Directory
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        - name: run-udev
          hostPath:
            path: /run/udev
            type: Directory
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
