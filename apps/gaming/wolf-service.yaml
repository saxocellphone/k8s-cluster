apiVersion: v1
kind: Service
metadata:
  name: wolf
  namespace: gaming
spec:
  # The Deployment uses hostPorts for Moonlight. This headless Service is only
  # for Kubernetes discovery/status and does not proxy the stream.
  clusterIP: None
  selector:
    app: wolf
  ports:
    - name: http
      port: 47989
      targetPort: http
      protocol: TCP
    - name: https
      port: 47984
      targetPort: https
      protocol: TCP
    - name: rtsp
      port: 48010
      targetPort: rtsp
      protocol: TCP
    - name: control
      port: 47999
      targetPort: control
      protocol: UDP
    - name: video
      port: 48100
      targetPort: video
      protocol: UDP
    - name: audio
      port: 48200
      targetPort: audio
      protocol: UDP
