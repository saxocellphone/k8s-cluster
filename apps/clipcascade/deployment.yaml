apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clipcascade-data
  namespace: clipcascade
spec:
  # Encrypted H2 file DB lives at /database. SQLite-class write workload
  # (single writer, fsync-heavy) -- keep it on Longhorn, not NFS.
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clipcascade
  namespace: clipcascade
  labels:
    app: clipcascade
spec:
  replicas: 1
  # RWO PVC + single H2 writer -- never run two pods concurrently.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: clipcascade
  template:
    metadata:
      labels:
        app: clipcascade
    spec:
      # Longhorn volumes only attach on Talos workers carrying the iscsi-tools
      # extension.
      nodeSelector:
        extensions.talos.dev/iscsi-tools: "v0.2.0"
      containers:
      - name: clipcascade
        image: sathvikrao/clipcascade:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        # Server-relay (P2S) mode is the default and what we want -- P2P
        # would require STUN/TURN that we're not running.
        - name: CC_P2P_ENABLED
          value: "false"
        - name: CC_SIGNUP_ENABLED
          value: "false"
        # 5 MiB covers most clipboard payloads (text, small images). Bigger
        # images get rejected; bump if needed.
        - name: CC_MAX_MESSAGE_SIZE_IN_MiB
          value: "5"
        # Lock CORS / WebSocket origins to the two hostnames that actually
        # serve this app (LAN ingress + CF Tunnel public hostname).
        - name: CC_ALLOWED_ORIGINS
          value: "https://clipcascade.k8s.home,https://clip.victornazzaro.com"
        - name: CC_SERVER_LOGGING_LEVEL
          value: "INFO"
        # Override the upstream's published default DB encryption password
        # (the default is in their public repo, so anyone with the data
        # volume could decrypt). Generated value lives in the SOPS secret.
        - name: CC_SERVER_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: clipcascade-secrets
              key: CC_SERVER_DB_PASSWORD
        - name: TZ
          value: "America/Los_Angeles"
        volumeMounts:
        - name: data
          mountPath: /database
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: clipcascade-data
