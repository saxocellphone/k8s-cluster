apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-inference
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/saxocellphone/k8s-cluster.git
    targetRevision: main
    path: apps/ai-inference
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-inference
  # The mode-switcher owns /spec/replicas for every GPU workload (it scales the
  # active mode to 1 and drains the rest to 0). selfHeal must not fight it, so
  # replica drift is ignored for each. Keep this list in sync with WORKLOADS in
  # apps/ai-inference/mode-switcher.py.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: hipfire
      namespace: ai-inference
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: comfyui
      namespace: ai-inference
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: vllm
      namespace: ai-inference
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: qwen-full
      namespace: ai-inference
      jsonPointers:
        - /spec/replicas

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
