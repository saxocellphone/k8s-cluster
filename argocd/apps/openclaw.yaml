apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/saxocellphone/k8s-cluster.git
    targetRevision: main
    path: apps/openclaw
  destination:
    server: https://kubernetes.default.svc
    namespace: openclaw
  # volumeName is immutable once bound; ignore live value so Argo does not try to
  # clear it when git omits the field (e.g. after manual PV re-bind or restore).
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      name: openclaw-data
      namespace: openclaw
      jsonPointers:
        - /spec/volumeName
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
