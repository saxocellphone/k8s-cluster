apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reloader
  namespace: argocd
spec:
  project: default
  sources:
  - repoURL: https://stakater.github.io/stakater-charts
    chart: reloader
    targetRevision: 2.2.12
    helm:
      releaseName: reloader
      valueFiles:
        - $values/infrastructure/reloader/values.yaml
  - repoURL: https://github.com/saxocellphone/k8s-cluster.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: reloader
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true