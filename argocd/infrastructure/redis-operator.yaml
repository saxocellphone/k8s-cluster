apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: ghcr.io/ot-container-kit/charts
      chart: redis-operator
      targetRevision: 0.25.0
      helm:
        releaseName: redis-operator
        valueFiles:
          - $values/infrastructure/redis-operator/values.yaml
    - repoURL: https://github.com/saxocellphone/k8s-cluster.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: redis-operator
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
