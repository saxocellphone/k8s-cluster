apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default
  sources:
  - repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.11.2
    helm:
      valueFiles:
        - $values/infrastructure/longhorn/values.yaml
  - repoURL: https://github.com/saxocellphone/k8s-cluster.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
