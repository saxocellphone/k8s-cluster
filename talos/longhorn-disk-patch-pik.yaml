machine:
  install:
    # Use the schematic'd installer image (iscsi-tools, qemu-guest-agent,
    # util-linux-tools) so the disk install matches gcx's running config.
    # Schematic ID confirmed via: talosctl get extensions on gcx.
    image: factory.talos.dev/installer/88d1f7a5c4f1d3aba7df787c448c1d3d008ed29cfb34af53fa0df4336a56040b:v1.11.5
  disks:
    - device: /dev/sdb
      partitions:
        - mountpoint: /var/mnt/longhorn
