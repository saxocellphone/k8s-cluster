name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '24 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL semantic analysis
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

  semgrep:
    name: Semgrep OSS static analysis
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.167.0
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run blocking custom Semgrep rules
        run: semgrep scan --config .semgrep/security.yml --metrics=off --severity ERROR .

      - name: Run Semgrep community analysis
        continue-on-error: true
        run: semgrep ci --config auto --config .semgrep/security.yml --sarif --output semgrep.sarif
        env:
          SEMGREP_SEND_METRICS: off
          SEMGREP_APP_TOKEN: ""

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif

  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Run Gitleaks OSS CLI
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 detect --source . --no-git --config .gitleaks.toml --redact --no-banner --exit-code 1

  trufflehog:
    name: TruffleHog verified secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  checkov:
    name: Checkov IaC scan
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: kubernetes,terraform,github_actions,secrets
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: true
          quiet: true

      - name: Upload Checkov SARIF
        if: always() && hashFiles('checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov.sarif
