name: Trigger Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - terraform/**
      - .github/workflows/trigger-terraform-plans.yml

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch private Terraform apply
    runs-on: ubuntu-latest
    env:
      MODULE: all
      REF: main
    steps:
      - name: Trigger private ops workflow
        env:
          GH_TOKEN: ${{ secrets.OPS_REPO_DISPATCH_TOKEN }}
        run: |
          gh api repos/saxocellphone/k8s-cluster-ops/dispatches \
            --method POST \
            -f event_type=terraform-apply \
            -f client_payload[module]="$MODULE" \
            -f client_payload[ref]="$REF"
